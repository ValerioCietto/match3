<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sewer Rat - Canvas Animation</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:grid; place-items:center;
    background:#111512; color:#d8ddd5;
    font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  }
  .game{width:min(100%,700px); padding:14px}
  canvas{
    display:block; width:100%; aspect-ratio:16/9;
    border:1px solid #344039; border-radius:12px;
    background:linear-gradient(#18201c,#101512);
    touch-action:none;
  }
  .controls{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px}
  button{
    min-height:52px; border:1px solid #49574e; border-radius:10px;
    background:#252d28; color:#edf0eb; font-size:16px; font-weight:700;
  }
  button:active{transform:translateY(1px); background:#303a34}
  .state{text-align:center; margin:9px 0 0; font-size:13px; color:#929d95}
  .character-links { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:18px; font-size:13px }
  .character-links a { color:#e2be78; text-underline-offset:4px }
  .character-links a[aria-current="page"] { color:#eee9da; font-weight:700 }
  .character-links a:focus-visible { outline:2px solid #ffe0a0; outline-offset:4px }
</style>
</head>
<body>
<div class="game">
  <nav class="character-links" aria-label="Art pages"><a href="barbarian.html">Barbarian</a> <a href="bat.html">Bat</a> <a href="human.html">Human</a> <a href="lich.html">Lich</a> <a href="priest.html">Priest</a> <a href="rat.html" aria-current="page">Rat</a> <a href="rogue-healer-princess.html">Princess</a> <a href="Scorpion-bear.html">Scorpion Bear</a></nav>
  <nav class="character-links" aria-label="Scenery"><span>Scenery</span> <a href="city.html">City</a> <a href="sewers.html">Sewers</a> <a href="countryside.html">Countryside</a></nav>
  <canvas id="c"></canvas>
  <div class="controls">
    <button data-a="run">RUN</button>
    <button data-a="attack">ATTACK</button>
    <button data-a="die">DIE</button>
  </div>
  <div class="state" id="state">IDLE</div>
</div>

<script>
// Run: open this HTML file directly in any modern browser.
const canvas = document.querySelector("#c");
const ctx = canvas.getContext("2d");
const stateEl = document.querySelector("#state");

let state="idle", started=performance.now(), dead=false;
const durations={run:Infinity, attack:650, die:900};

function resize(){
  const dpr=Math.min(devicePixelRatio||1,2);
  const r=canvas.getBoundingClientRect();
  canvas.width=Math.round(r.width*dpr);
  canvas.height=Math.round(r.height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize); resize();

document.querySelectorAll("button").forEach(b=>b.onclick=()=>{
  state=b.dataset.a==="run" && state==="run" ? "idle" : b.dataset.a;
  started=performance.now(); dead=false;
  stateEl.textContent=state.toUpperCase();
  document.querySelector('[data-a="run"]').textContent=state==="run" ? "STOP" : "RUN";
});

function ellipse(x,y,rx,ry,fill,rot=0){
  ctx.beginPath(); ctx.ellipse(x,y,rx,ry,rot,0,Math.PI*2);
  ctx.fillStyle=fill; ctx.fill();
}
function line(points,width,color){
  ctx.beginPath(); ctx.moveTo(...points[0]);
  for(let i=1;i<points.length;i++) ctx.lineTo(...points[i]);
  ctx.lineWidth=width; ctx.strokeStyle=color; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.stroke();
}
function rat(x,y,s,t,mode){
  let bob=0, tail=0, jaw=0, lunge=0, rot=0;
  const running=mode==="run";
  const cycle=t*2.8, phase=cycle*Math.PI*2;
  let stretch=1;

  if(mode==="idle"){
    bob=Math.sin(t*3)*1.3; tail=Math.sin(t*2.2)*5;
  }
  if(mode==="run"){
    // One gathered stride followed by an airborne extension.
    bob=-3-4*Math.sin(phase);
    stretch=1+Math.cos(phase)*.045;
    tail=Math.sin(phase-.8)*7;
  }
  if(mode==="attack"){
    const p=Math.min((performance.now()-started)/durations.attack,1);
    // forward quickly, hold near bite, then return
    lunge = p<.35 ? p/.35*27 : p<.55 ? 27 : 27*(1-(p-.55)/.45);
    jaw = Math.sin(Math.min(1,p/.55)*Math.PI)*7;
    bob=-Math.sin(p*Math.PI)*2;
  }
  if(mode==="die"){
    const p=Math.min((performance.now()-started)/durations.die,1);
    const q=1-Math.pow(1-p,3);
    rot=-Math.PI*q;
    bob=-Math.sin(p*Math.PI)*10;
  }

  ctx.save();
  ctx.translate(x+lunge*s,y+bob*s);
  ctx.scale(s,s);
  ctx.rotate(rot);

  // tail behind body
  ctx.beginPath();
  ctx.moveTo(-42,3);
  ctx.bezierCurveTo(-67,-7+tail,-83,18-tail*.6,-102,6+Math.sin(phase-1.7)*(running?10:0));
  ctx.strokeStyle="#8b5f62"; ctx.lineWidth=7; ctx.lineCap="round"; ctx.stroke();
  ctx.strokeStyle="#b07a7b"; ctx.lineWidth=2; ctx.stroke();

  function paw(x,y,hind,far){
    line([[x-(hind?5:1.5),y],[x+(hind?8:3),y]],(far?4:5)*(hind?1.1:.7),far?"#715554":"#a27972");
  }

  function runningLeg(hipX,offset,hind,far){
    const p=((cycle+offset)%1+1)%1;
    const stance=.46, reach=hind?12:15;
    let footX,footY;
    if(p<stance){
      // The paw travels backwards at constant speed while on the floor.
      footX=hipX+reach-2*reach*p/stance;
      footY=30-bob;
    }else{
      const q=(p-stance)/(1-stance);
      const ease=q*q*(3-2*q);
      footX=hipX-reach+2*reach*ease;
      footY=30-bob-Math.sin(q*Math.PI)*(hind?11:13);
    }
    const hipY=hind?9:12,dx=footX-hipX,dy=footY-hipY;
    const distance=Math.max(.001,Math.hypot(dx,dy));
    const segment=hind?16:23;
    const bend=Math.sqrt(Math.max(0,segment*segment-distance*distance/4))*(hind?1:-1);
    const kneeX=(hipX+footX)/2+dy/distance*bend;
    const kneeY=(hipY+footY)/2-dx/distance*bend;
    line([[hipX,hipY],[kneeX,kneeY],[footX,footY-2]],(far?6:7)*(hind?1.35:1),far?"#4c443e":"#756258");
    paw(footX,footY,hind,far);
  }

  // Cancel body breathing at the feet; knees absorb half the movement.
  const footOffset=mode==="idle" ? -bob : 0;

  // Offset each pair slightly for a rat's bounding gallop.
  if(running){
    runningLeg(-31,.12,true,true);
    runningLeg(22,.57,false,true);
  }else{
    line([[-29,13],[-32,24+footOffset*.5],[-39,29+footOffset]],9,"#5b5048");
    line([[23,15],[5,22+footOffset*.5],[9,30+footOffset]],7,"#5b5048");
    paw(-39,30+footOffset,true,true);
    paw(9,31+footOffset,false,true);
  }

  // body + belly
  ctx.save();
  ctx.scale(stretch,1/stretch);
  ellipse(-10,0,43,25,"#514d43",-0.05);
  ellipse(-4,10,31,13,"#686054",-0.03);

  // scruffy back tufts
  ctx.fillStyle="#514d43";
  for(let i=0;i<5;i++){
    const px=-36+i*13;
    ctx.beginPath(); ctx.moveTo(px,-18); ctx.lineTo(px+5,-30-(i%2)*3); ctx.lineTo(px+10,-18); ctx.fill();
  }
  ctx.restore();

  // near legs
  if(running){
    runningLeg(-24,0,true,false);
    runningLeg(19,.45,false,false);
  }else{
    line([[-24,13],[-21,24+footOffset*.5],[-28,30+footOffset]],10,"#756258");
    line([[19,15],[3,22+footOffset*.5],[17,30+footOffset]],8,"#756258");
    paw(-28,31+footOffset,true,false);
    paw(17,31+footOffset,false,false);
  }

  ctx.save();
  if(running){ctx.translate(24,-5);ctx.rotate(Math.sin(phase-.5)*.035);ctx.translate(-24,5);}
  // ear behind head
  ellipse(40,-24,8,9,"#4b4140",.25);
  //ellipse(40,-24,5,6,"#835d60",.25);

  // head and pointed muzzle
  ellipse(34,-5,27,22,"#5e574c",-0.12);
  ctx.beginPath();
  ctx.moveTo(48,-15); ctx.quadraticCurveTo(69,-9,77,-1);
  ctx.quadraticCurveTo(65,8,47,8+jaw*.18);
  ctx.closePath(); ctx.fillStyle="#6c6255"; ctx.fill();

  // ear foreground
  ellipse(25,-23,11,12,"#493f3c",-.25);
  ellipse(25,-23,7,8,"#8a6263",-.25);


  // jaw during bite
  if(jaw>1){
    ctx.save(); ctx.translate(57,3); ctx.rotate(jaw*.035);
    ellipse(7,5,14,7,"#4c443d",.12);
    ctx.fillStyle="#d5c8a9";
    ctx.beginPath(); ctx.moveTo(15,0);ctx.lineTo(20,4);ctx.lineTo(14,5);ctx.fill();
    ctx.restore();
  }

  // eye + highlight
  ellipse(47,-10,4.6,4.6,"#9f302b");
  ellipse(48.5,-11.5,1.3,1.3,"#ffd6a0");

  // nose
  ellipse(76,-2,5,4,"#211f1e");
  // whiskers
  line([[68,-3],[59,-10]],1,"#9c9485");
  line([[68,0],[59,1]],1,"#9c9485");
  line([[68,3],[59,10]],1,"#9c9485");

  ctx.restore();
  ctx.restore();
}

function sewer(w,h){
  // floor
  ctx.fillStyle="#202720"; ctx.fillRect(0,h*.73,w,h*.27);
  ctx.strokeStyle="#303a31"; ctx.lineWidth=2;
  for(let x=-20;x<w+60;x+=70){
    ctx.beginPath(); ctx.moveTo(x,h*.73);ctx.lineTo(x+35,h);ctx.stroke();
  }
  // grime/water line
  ctx.fillStyle="#293b2d";
  ctx.fillRect(0,h*.76,w,5);
  for(let x=10;x<w;x+=47) ellipse(x,h*.79,12,2,"#354b38");
}

function loop(now){
  const w=canvas.clientWidth,h=canvas.clientHeight;
  ctx.clearRect(0,0,w,h); sewer(w,h);

  if(state!=="idle" && now-started>=durations[state]){
    if(state==="die"){ dead=true; }
    else { state="idle"; stateEl.textContent="IDLE"; started=now; }
  }

  const scale=Math.min(w/360,h/220)*1.15;
  const elapsed=(now-started)/1000;
  const lift=state==="run" ? (3+4*Math.sin(elapsed*2.8*Math.PI*2))/7 : 0;
  ctx.save();
  ctx.globalAlpha=.24-lift*.07;
  ellipse(w*.48,h*.62+31*scale,(62-lift*6)*scale,5*scale,"#000");
  ctx.restore();
  rat(w*.48,h*.62,scale,elapsed,dead?"die":state);

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
