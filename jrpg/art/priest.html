<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Moonkeeper · Dark Elf Priest</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#11131e;color:#eeebf6;font-family:system-ui,sans-serif;padding:24px}main{width:min(900px,100%)}header{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:22px}.eyebrow{color:#b8a1dc;font-size:11px;letter-spacing:.24em;text-transform:uppercase;margin:0 0 8px}h1{font:400 clamp(28px,5vw,42px) Georgia,serif;margin:0}.badge{color:#b7adc9;border:1px solid #423b56;border-radius:30px;padding:8px 12px;font-size:11px;white-space:nowrap}.stage{position:relative;border:1px solid #49405f;border-radius:16px;overflow:hidden;background:#19172b}canvas{display:block;width:100%;aspect-ratio:16/10}.label{position:absolute;top:20px;left:22px;color:#b1a4cb;font-size:10px;letter-spacing:.2em;pointer-events:none}.status{position:absolute;bottom:20px;left:22px;font-size:11px;letter-spacing:.12em;text-transform:uppercase}.status:before{content:'';display:inline-block;margin-right:10px;width:6px;height:6px;border-radius:50%;background:#91ead7;box-shadow:0 0 12px #91ead7}.controls{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}.spells{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:10px}button{cursor:pointer;display:flex;justify-content:center;align-items:center;gap:12px;min-height:58px;border:1px solid #423b56;border-radius:10px;background:#201d30;color:#d6cee5;font:600 14px system-ui}button:hover{background:#30283f}button[aria-pressed=true]{background:#38304c;border-color:#b8a1dc;color:#e7d6ff}button:focus-visible{outline:2px solid #b9f6e9;outline-offset:4px}kbd{font:10px system-ui;color:#b0a5bd;border:1px solid #574d66;border-radius:4px;padding:2px 5px}footer{display:flex;justify-content:space-between;gap:16px;margin-top:16px;color:#a398b5;font-size:12px;line-height:1.6}@media(max-width:640px){.spells{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){body{padding:16px}.badge,kbd{display:none}footer{flex-direction:column;gap:3px}.label{top:14px;left:14px}}
  .character-links { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:18px; font-size:13px }
  .character-links a { color:#e2be78; text-underline-offset:4px }
  .character-links a[aria-current="page"] { color:#eee9da; font-weight:700 }
  .character-links a:focus-visible { outline:2px solid #ffe0a0; outline-offset:4px }
</style>
</head>
<body>
<main>
  <nav class="character-links" aria-label="Art pages"><a href="barbarian.html">Barbarian</a> <a href="human.html">Human</a> <a href="priest.html" aria-current="page">Priest</a> <a href="rat.html">Rat</a> <a href="rogue-healer-princess.html">Princess</a></nav>
<header><div><p class="eyebrow">Character study / 03</p><h1>The Moonkeeper</h1></div><span class="badge">DARK ELF · PRIEST</span></header>
<div class="stage">
<canvas id="priest" role="img" aria-label="Animated dark elf priest with violet skin, white hair, pointed ears, and a golden healer staff in a moonlit sanctuary.">Your browser needs canvas support to display the priest.</canvas>
<div class="label">THE MOON SANCTUARY / SILVERWOOD</div>
<div class="status" id="status" role="status">Idle · a quiet prayer</div>
</div>
<div class="controls" role="group" aria-label="Priest stance">
<button type="button" data-mode="idle" aria-pressed="true">Idle <kbd>I</kbd></button>
<button type="button" data-mode="run" aria-pressed="false">Run <kbd>R</kbd></button>
</div>
<div class="controls spells" role="group" aria-label="Priest abilities">
<button type="button" data-mode="heal" aria-pressed="false">Heal <kbd>1</kbd></button>
<button type="button" data-mode="strike" aria-pressed="false">Strike <kbd>2 / SPACE</kbd></button>
<button type="button" data-mode="greater-heal" aria-pressed="false">Greater Heal <kbd>3</kbd></button>
<button type="button" data-mode="bolt" aria-pressed="false">Cast Bolt <kbd>4</kbd></button>
</div>
<footer><span>Moonlight in her hands. Mercy in her magic.</span><span id="asset-status">Healer staff equipped · choose an ability.</span></footer>
</main>
<script>
(() => {
  'use strict';
  const canvas=document.querySelector('#priest'), ctx=canvas.getContext('2d');
  const buttons=[...document.querySelectorAll('[data-mode]')], status=document.querySelector('#status');
  const staff=new Image();
  staff.src='healer-staff.png';
  staff.onerror=()=>{document.querySelector('#asset-status').textContent='Healer staff PNG could not load. Reload to retry.';};
  const TAU=Math.PI*2, durations={heal:1.6,strike:.85,'greater-heal':2.5,bolt:1.25};
  const labels={idle:'Idle · a quiet prayer',run:'Run · swift footsteps',heal:'Heal · restoring light',strike:'Strike · staff sweep','greater-heal':'Greater Heal · sanctuary of light',bolt:'Cast Bolt · lunar spark'};
  let mode='idle',stance='idle',age=0,time=0,last=null,travel=0;
  const clamp=x=>Math.max(0,Math.min(1,x));
  const ease=x=>{x=clamp(x);return x*x*(3-2*x);};
  const joint=(x,y,length,angle)=>[x+Math.sin(angle)*length,y+Math.cos(angle)*length];
  // Use the human's stride and ankle timing with the priest's shorter legs.
  const ankleCurve=[[0,-.15],[.18,-.12],[.28,0],[.36,.08],[.43,-.12],[.50,-.38],[.56,-.08],[.62,.25],[.72,.08],[.875,-.24],[1,-.15]];
  function runLeg(front,phase){
    const hip=[front?9:-9,-65],angle=Math.sin(phase)*.85;
    const bend=.3+Math.max(0,Math.cos(phase))*1.25;
    const knee=joint(...hip,32,angle),ankle=joint(...knee,31,angle-bend);
    line([hip,knee,ankle],front?'#89739e':'#4c405e',12);
    ellipse(...knee,6,6,front?'#a38abb':'#655279');
    const progress=((phase/TAU)%1+1)%1;
    let rotation=0;
    for(let i=1;i<ankleCurve.length;i++){
      const [end,value]=ankleCurve[i],[start,previous]=ankleCurve[i-1];
      if(progress<=end){rotation=-(angle-bend)+previous+(value-previous)*ease((progress-start)/(end-start));break;}
    }
    ctx.save();ctx.translate(...ankle);ctx.rotate(rotation);
    path([[-7,-5],[7,-5],[18,4],[17,9],[-8,9]],'#252236');
    line([[-7,8],[16,8]],front?'#a08db7':'#665679',2);
    ctx.restore();
  }
  function runArm(front,phase){
    // Both shoulders overlap in profile; each arm counters its own leg.
    const shoulder=[front?3:-3,-139];
    const upper=-.25+(front?-1:1)*Math.sin(phase)*.65;
    const elbow=joint(...shoulder,27,upper);
    const hand=joint(...elbow,25,upper+1.55);
    return {shoulder,elbow,hand};
  }
  function select(next){
    if(!Object.hasOwn(labels,next))return;
    if(next==='idle'||next==='run')stance=next;
    mode=next;age=0;
    buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));
    status.textContent=labels[mode];
    canvas.setAttribute('aria-label','Dark elf priest with violet skin, pointed ears, white hair and a golden healer staff. '+labels[mode]);
  }
  buttons.forEach(b=>b.addEventListener('click',()=>select(b.dataset.mode)));
  const keys={i:'idle',r:'run','1':'heal','2':'strike','3':'greater-heal','4':'bolt',' ':'strike'};
  document.addEventListener('keydown',e=>{
    if(e.repeat||e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
    if(e.key===' '&&e.target.closest('button'))return;
    const next=keys[e.key.toLowerCase()];if(next){e.preventDefault();select(next);}
  });
  function resize(){const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(canvas.clientWidth*dpr);canvas.height=Math.round(canvas.clientWidth*.625*dpr);}
  window.addEventListener('resize',resize);resize();
  function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,TAU);ctx.fill();}
  function path(points,color){ctx.fillStyle=color;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fill();}
  function line(points,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();}
  function glow(x,y,r,color){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(1,'transparent');ellipse(x,y,r,r,g);}
  function ring(x,y,r,color,width=2,flatten=1){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.ellipse(x,y,r,r*flatten,0,0,TAU);ctx.stroke();}
  function background(){
    const g=ctx.createLinearGradient(0,0,0,500);g.addColorStop(0,'#11152c');g.addColorStop(1,'#30233e');ctx.fillStyle=g;ctx.fillRect(0,0,800,500);
    glow(650,92,120,'#8989ca28');ellipse(650,92,28,28,'#d7d4ef');ellipse(661,84,25,25,'#15192f');
    for(let i=0;i<55;i++){const x=(i*137.7)%800,y=35+(i*71.3)%250;ellipse(x,y,1,1,'#bfbada');}
    for(let i=0;i<12;i++){const x=((i*91-travel*.25)%950+950)%950-75;line([[x,405],[x+10,170],[x-12,45]],'#191b30',24);line([[x+6,220],[x+55,135]],'#191b30',10);}
    path([[0,400],[140,378],[300,400],[510,383],[800,398],[800,500],[0,500]],'#232333');
    ctx.fillStyle='#3c344b';ctx.fillRect(0,415,800,2);
    for(let i=0;i<20;i++){const x=((i*51-travel)%850+850)%850;line([[x,431+i%3*14],[x+18,431+i%3*14]],'#494052',1);}
    for(let i=0;i<14;i++){const x=(i*63+Math.sin(time*.3+i)*12)%800,y=330+Math.sin(time*.6+i*2)*40;glow(x,y,7,'#8cdcd12a');ellipse(x,y,1.2,1.2,'#95d9cf');}
  }
  function character(){
    const running=mode==='run', phase=time*10, p=durations[mode]?clamp(age/durations[mode]):0;
    const casting=mode==='heal'||mode==='greater-heal'||mode==='bolt';
    const lift=casting?Math.sin(Math.PI*clamp(p/.85)):0;
    const swing=mode==='strike'?(p<.3?-.65*ease(p/.3):p<.62?-.65+2.15*ease((p-.3)/.32):1.5*(1-ease((p-.62)/.38))):0;
    const bob=running?5+Math.abs(Math.sin(phase))*7:Math.sin(time*2)*2;
    const lean=running?.1:mode==='strike'?Math.sin(p*Math.PI)*.12:0;
    ellipse(365,413,52,9,'#0a0d1e70');
    ctx.save();
    if(running){ctx.translate(365,345-bob);ctx.rotate(lean);ctx.translate(0,65);}
    else{ctx.translate(365,410-bob);ctx.rotate(lean);}
    // Opposite thigh swings, a folded recovery knee, and articulated boots.
    if(running){runLeg(false,phase+Math.PI);runLeg(true,phase);}
    else for(const side of [-1,1]){
      const step=running?Math.sin(phase+(side===1?Math.PI:0))*27:side*8;
      line([[side*9,-65],[step,-32],[step+side*6,-8]],side===1?'#89739e':'#4c405e',12);
      path([[step-7,-13],[step+7,-13],[step+18,-4],[step+17,1],[step-8,1]],'#252236');
    }
    const hem=running?-8+Math.sin(phase-.5)*5:Math.sin(time*2)*3;
    const rearArm=running?runArm(false,phase):null;
    if(rearArm){
      line([rearArm.shoulder,rearArm.elbow,rearArm.hand],'#4c3d61',13);
      line([rearArm.elbow,rearArm.hand],'#968ba9',9);
      ellipse(...rearArm.hand,6,5,'#76588f');
    }
    // Long violet vestments, ivory panels, gold edging and crescent clasp.
    ctx.save();ctx.scale(.65,1);
    path([[-24,-151],[20,-151],[27,-103],[35+hem,-25],[8,-32],[0,-51],[-9,-27],[-37+hem,-30],[-26,-98]],'#493565');
    path([[-21,-143],[-7,-133],[-11,-46],[-29+hem,-34],[-19,-97]],'#b6b0cb');
    path([[8,-139],[20,-145],[22,-99],[29+hem,-34],[10,-43]],'#e0d8e7');
    line([[-21,-143],[-7,-133],[-11,-46],[-29+hem,-34]],'#c2a766',2);
    line([[20,-145],[22,-99],[29+hem,-34]],'#d3ba78',2);
    path([[-26,-147],[-17,-154],[20,-154],[29,-140],[17,-128],[-15,-129]],'#6d5187');
    line([[-20,-105],[22,-105]],'#c7ad6a',5);ellipse(2,-105,5,7,'#8ce2de');
    ellipse(0,-141,7,7,'#e3d3a6');ellipse(3,-143,6,6,'#6d5187');
    ctx.restore();
    // Rear arm and open casting hand.
    const rearElbow=[-28,-116];
    const rearHand=[casting?45+lift*15:30,casting?-139-lift*23:-106];
    const [handX,handY]=rearHand;
    if(!running){
    line([[-17,-139],rearElbow,rearHand],'#65507e',15);
    line([rearElbow,rearHand],'#c5bcd8',10);
    ellipse(handX,handY,7,5,'#9474b4');
    if(casting){line([[handX,handY],[handX+8,handY-8]],'#a889c4',3);glow(handX,handY-7,23,'#96ffdf85');}
    }
    // White hair silhouette, violet profile and visibly long pointed ear.
    path([[-19,-184],[-27,-162],[-30,-126],[-14,-140],[2,-160],[22,-174],[17,-194],[-3,-202]],'#b7b7d7');
    line([[1,-161],[1,-146]],'#8866a7',12);
    path([[-13,-190],[11,-190],[18,-179],[18,-174],[25,-168],[17,-164],[15,-155],[5,-151],[-10,-159]],'#9474b4');
    path([[-5,-175],[-35,-186],[-19,-163],[-5,-165]],'#a489be');
    line([[-29,-182],[-16,-170],[-8,-171]],'#66517f',2);
    path([[-20,-181],[-17,-196],[-3,-204],[15,-198],[22,-188],[7,-190],[-1,-176],[-12,-168],[-10,-183]],'#e4e3f2');
    line([[10,-173],[17,-173]],'#28223e',2);ellipse(15,-173,2,1.5,'#b8fff0');
    line([[10,-159],[16,-160]],'#584165',1.5);ellipse(-17,-168,2,3,'#e2c87d');
    // The supplied staff stays attached to the front hand in every pose.
    const frontArm=running?runArm(true,phase):null;
    const frontShoulder=running?frontArm.shoulder:[18,-139];
    const frontElbow=running?frontArm.elbow:[35,-122];
    const frontHand=running?frontArm.hand:[34,casting?-113-lift*19:-102];
    const [gripX,gripY]=frontHand;
    line([frontShoulder,frontElbow,frontHand],'#6d5187',15);
    line([frontElbow,frontHand],'#ded6e6',10);
    ctx.save();ctx.translate(gripX,gripY);ctx.rotate(running?.2-Math.sin(phase)*.12:casting?-.12-lift*.2:.06+swing);
    if(staff.complete&&staff.naturalWidth)ctx.drawImage(staff,-23,-139,46,151);
    if(casting)glow(0,-122,30+lift*12,mode==='bolt'?'#aacaff88':'#9fffe08a');
    ctx.restore();ellipse(gripX,gripY,6,5,'#a183bd');
    ctx.restore();
    effects(p);
  }
  function effects(p){
    if(mode==='heal'||mode==='greater-heal'){
      const greater=mode==='greater-heal', power=Math.sin(p*Math.PI),radius=greater?110:62;
      ctx.save();ctx.globalAlpha=power;
      glow(365,330,radius,greater?'#c0a7ff70':'#78f2c24d');
      ring(365,409,radius,'#a8ffe2',2,.22);
      if(greater){ring(365,409,radius+14,'#c4b2ff',2,.22);ring(365,295,80,'#eadbff',2);}
      for(let i=0;i<(greater?20:10);i++){
        const a=i*2.4+time*.8,x=365+Math.cos(a)*radius*.7,y=410-((p*220+i*19)%180);
        glow(x,y,10,'#baffdf55');line([[x-4,y],[x+4,y]],'#c7ffed',2);line([[x,y-4],[x,y+4]],'#c7ffed',2);
      }
      ctx.restore();
    }
    if(mode==='strike'&&p>.3&&p<.82){
      ctx.save();ctx.globalAlpha=Math.sin((p-.3)/.52*Math.PI);ctx.strokeStyle='#ead9a5';ctx.lineWidth=7;ctx.beginPath();ctx.arc(399,307,118,-1.9,-1.9+ease((p-.3)/.32)*2.1);ctx.stroke();ctx.restore();
    }
    if(mode==='bolt'&&p>.43){
      const flight=clamp((p-.43)/.57),x=416+flight*335,y=259-flight*12;
      ctx.save();ctx.globalAlpha=Math.min(1,(1-flight)*5);
      glow(x,y,34,'#bbc5ffb0');line([[x-65,y+4],[x-38,y-3],[x-21,y+3],[x,y]],'#a8aaff',6);
      ellipse(x,y,13,7,'#efffff');ring(x,y,21,'#c6b8ff',2);ctx.restore();
    }
  }
  function frame(now){
    const dt=last===null?0:Math.min((now-last)/1000,.05);last=now;time+=dt;age+=dt;
    if(durations[mode]&&age>=durations[mode])select(stance);
    if(mode==='run')travel+=dt*160;
    ctx.setTransform(canvas.width/800,0,0,canvas.height/500,0,0);
    background();character();requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange',()=>{last=null;});
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
