<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Lich · Dark Scythe Animation</title>
<style>
  * { box-sizing:border-box }
  body { margin:0; min-height:100svh; display:grid; place-items:center; padding:24px; background:#100d18; color:#ede6f5; font-family:system-ui,sans-serif }
  main { width:min(900px,100%) }
  .character-links { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:18px; font-size:13px }
  .character-links a { color:#c3a0ed; text-underline-offset:4px }
  .character-links a[aria-current="page"] { color:#eee9da; font-weight:700 }
  header { display:flex; align-items:end; justify-content:space-between; gap:16px; margin-bottom:22px }
  .eyebrow { color:#b799da; font-size:11px; letter-spacing:.24em; text-transform:uppercase; margin:0 0 8px }
  h1 { font:400 clamp(28px,5vw,42px) Georgia,serif; margin:0 }
  .badge { color:#b5a6c7; border:1px solid #493a59; border-radius:30px; padding:8px 12px; font-size:11px }
  .stage { position:relative; border:1px solid #4e3b63; border-radius:16px; overflow:hidden; background:#1b1526 }
  canvas { display:block; width:100%; aspect-ratio:16/10 }
  .label { position:absolute; top:20px; left:22px; color:#b9a5cb; font-size:10px; letter-spacing:.2em; pointer-events:none }
  .status { position:absolute; bottom:20px; left:22px; font-size:11px; letter-spacing:.12em; text-transform:uppercase }
  .status::before { content:''; display:inline-block; width:6px; height:6px; margin-right:10px; border-radius:50%; background:#c782ff; box-shadow:0 0 12px #ac4dff }
  .controls { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:16px }
  .attacks { grid-template-columns:repeat(3,minmax(0,1fr)); margin-top:10px }
  button { cursor:pointer; display:flex; justify-content:center; align-items:center; gap:12px; min-height:58px; border:1px solid #493a59; border-radius:10px; background:#21192d; color:#ded0ed; font:600 14px system-ui }
  button:hover { background:#34233f }
  button[aria-pressed="true"] { background:#422757; border-color:#b877ed; color:#f0d6ff }
  button:focus-visible,a:focus-visible { outline:2px solid #e2b8ff; outline-offset:4px }
  kbd { font:10px system-ui; color:#b7a5c8; border:1px solid #624873; border-radius:4px; padding:2px 5px }
  footer { display:flex; justify-content:space-between; gap:16px; margin-top:16px; color:#a393b2; font-size:12px; line-height:1.6 }
  @media(max-width:520px) { body { padding:16px } .badge,kbd { display:none } footer { flex-direction:column; gap:3px } .attacks button { padding:8px 4px } }
</style>
<link rel="stylesheet" href="menu.css">
<script src="menu.js" defer></script>
</head>
<body>
<main>
  <div data-art-menu><a class="art-menu-fallback" href="menu.html">Browse Characters, Enemies and Scenery</a></div>
  <header><div><p class="eyebrow">Character study / Undead</p><h1>The Lich</h1></div><span class="badge">SKELETON · DARK MAGE</span></header>
  <div class="stage">
    <canvas id="lich" role="img" aria-label="Left-facing skeletal dark mage holding a dark scythe in both hands, with glowing purple eyes in a ruined graveyard.">Your browser needs canvas support to display the Lich.</canvas>
    <div class="label">THE HOLLOW CRYPT / VIOLET REQUIEM</div>
    <div class="status" id="status" role="status">Idle · an unblinking vigil</div>
  </div>
  <div class="controls" role="group" aria-label="Lich stance">
    <button type="button" data-mode="idle" aria-pressed="true">Idle <kbd>I</kbd></button>
    <button type="button" data-mode="walk" aria-pressed="false">Walk <kbd>W / R</kbd></button>
  </div>
  <div class="controls attacks" role="group" aria-label="Lich attacks">
    <button type="button" data-mode="sweep" aria-pressed="false">Sweep <kbd>1 / SPACE</kbd></button>
    <button type="button" data-mode="execute" aria-pressed="false">Execute <kbd>2</kbd></button>
    <button type="button" data-mode="doom" aria-pressed="false">Doom <kbd>3</kbd></button>
  </div>
  <footer><span>Still as the grave. Swift as the final cut.</span><span id="asset-status">Dark scythe equipped · attacks face left.</span></footer>
</main>
<script>
(() => {
  'use strict';
  const canvas=document.querySelector('#lich'),ctx=canvas.getContext('2d');
  const buttons=[...document.querySelectorAll('[data-mode]')],status=document.querySelector('#status');
  const scythe=new Image();scythe.src='dark-scythe.png';
  scythe.onerror=()=>{document.querySelector('#asset-status').textContent='Dark scythe image unavailable · showing a drawn scythe.';};
  const TAU=Math.PI*2,clamp=t=>Math.max(0,Math.min(1,t)),mix=(a,b,t)=>a+(b-a)*t;
  const ease=t=>{t=clamp(t);return t*t*(3-2*t);};
  const attacks={sweep:{duration:.58,start:.24,end:.43},execute:{duration:.64,start:.28,end:.50},doom:{duration:1.35}};
  const labels={idle:'Idle · an unblinking vigil',walk:'Walk · a slow, low shuffle',sweep:'Sweep · reaping low',execute:'Execute · the falling blade',doom:'Doom · the depths awaken'};
  let mode='idle',stance='idle',time=0,age=0,last=null,position=490;
  const shoulders={front:[3,-138],rear:[-3,-138]},upperLength=36,foreLength=34;
  // Grip coordinates follow the curved shaft of the supplied 83 × 141 image.
  const weaponScale=1.45,gripPixel=[22,99],rearPixel=[24,79],tipPixel=[82,35];
  const ready={x:32,y:-101,angle:-.12,projection:1,lunge:0};
  const moves={
    sweep:[
      {at:0,...ready},
      {at:.24,...ready,x:32,y:-109,angle:1.4,projection:-.7,lunge:-6},
      {at:.43,...ready,x:32,y:-109,angle:1.4,projection:1,lunge:30},
      {at:.51,...ready,x:32,y:-109,angle:1.4,projection:1,lunge:30},
      {at:1,...ready}
    ],
    execute:[
      {at:0,...ready},
      {at:.28,...ready,x:18,y:-157,angle:-.85,lunge:-5},
      {at:.50,...ready,x:36,y:-85,angle:1.60,lunge:22},
      {at:.60,...ready,x:36,y:-85,angle:1.60,lunge:22},
      {at:1,...ready}
    ],
    doom:[
      {at:0,...ready},
      {at:.24,...ready,x:25,y:-144,angle:-.12},
      {at:.76,...ready,x:25,y:-144,angle:-.12},
      {at:1,...ready}
    ]
  };
  function poseAt(kind,p,t){
    if(kind==='walk')return {...ready,x:32+Math.sin(t*4.5)*2,y:-102+Math.cos(t*4.5),angle:-.12+Math.sin(t*4.5)*.03};
    if(!moves[kind])return {...ready};
    const frames=moves[kind];
    for(let i=1;i<frames.length;i++)if(p<=frames[i].at){
      const a=frames[i-1],b=frames[i],blend=ease((p-a.at)/(b.at-a.at)),pose={};
      for(const key of Object.keys(ready))pose[key]=mix(a[key],b[key],blend);
      return pose;
    }
    return {...ready};
  }
  function weaponPoint(pose,pixel){
    const x=(pixel[0]-gripPixel[0])*weaponScale,y=(pixel[1]-gripPixel[1])*weaponScale;
    return [pose.x+pose.projection*(x*Math.cos(pose.angle)-y*Math.sin(pose.angle)),pose.y+x*Math.sin(pose.angle)+y*Math.cos(pose.angle)];
  }
  function arm(shoulder,hand){
    const dx=hand[0]-shoulder[0],dy=hand[1]-shoulder[1],distance=Math.hypot(dx,dy);
    const along=(upperLength**2-foreLength**2+distance**2)/(2*distance);
    const bend=Math.sqrt(Math.max(0,upperLength**2-along**2));
    return {shoulder,hand,elbow:[shoulder[0]+(dx*along-dy*bend)/distance,shoulder[1]+(dy*along+dx*bend)/distance]};
  }
  function select(next){
    if(!Object.hasOwn(labels,next))return;
    if(attacks[next]&&(position<250||position>650))position=490;
    if(next==='idle'||next==='walk')stance=next;
    mode=next;age=0;
    buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));
    status.textContent=labels[mode];
    canvas.setAttribute('aria-label','Left-facing skeletal Lich holding a dark scythe in both hands. '+labels[mode]);
  }
  buttons.forEach(b=>b.addEventListener('click',()=>select(b.dataset.mode)));
  addEventListener('keydown',e=>{
    if(e.altKey||e.ctrlKey||e.metaKey||e.repeat||e.target.isContentEditable||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
    if(e.code==='Space'&&e.target.closest('button'))return;
    const next={KeyI:'idle',KeyW:'walk',KeyR:'walk',Digit1:'sweep',Digit2:'execute',Digit3:'doom',Space:'sweep'}[e.code];
    if(next){e.preventDefault();select(next);}
  });
  function resize(){const width=canvas.getBoundingClientRect().width,dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(width*.625*dpr);}
  new ResizeObserver(resize).observe(canvas);resize();
  function path(points,color,stroke=null,width=1.5){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fillStyle=color;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke();}}
  function line(points,color,width){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();}
  function oval(x,y,rx,ry,color){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,TAU);ctx.fillStyle=color;ctx.fill();}
  function glow(x,y,r,color){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(1,'transparent');oval(x,y,r,r,g);}
  const joint=(p,length,angle)=>[p[0]+Math.sin(angle)*length,p[1]+Math.cos(angle)*length];
  function background(){
    const sky=ctx.createLinearGradient(0,0,0,500);sky.addColorStop(0,'#100e1c');sky.addColorStop(1,'#392b45');ctx.fillStyle=sky;ctx.fillRect(0,0,800,500);
    glow(633,99,106,'#956ec92a');oval(633,99,31,31,'#c5b1d5');oval(644,89,29,29,'#15111f');
    for(let i=0;i<38;i++)oval((i*149.7)%800,35+(i*61)%251,1,1,'#a28eb657');
    for(let i=0;i<8;i++){
      const x=i*125-22;
      path([[x-18,385],[x-12,225],[x+9,217],[x+19,385]],'#1d1929');
      line([[x-4,263],[x-41,207],[x-57,147]],'#1d1929',9);
      line([[x+2,289],[x+36,242],[x+51,178]],'#1d1929',7);
    }
    path([[0,399],[164,382],[388,401],[588,385],[800,401],[800,500],[0,500]],'#211b2a');
    for(let i=0;i<6;i++){
      const x=65+i*132,y=392+(i%2)*8;
      path([[x-13,y],[x-12,y-38],[x-4,y-45],[x+9,y-40],[x+13,y]],'#342c3e','#554562');
      line([[x,y-32],[x,y-13]],'#675573',2);line([[x-5,y-26],[x+5,y-26]],'#675573',2);
    }
    for(let i=0;i<6;i++)oval(80+i*153+Math.sin(time*.2+i)*19,423+i%2*15,97,6,'#b1a0c408');
  }
  function bone(a,b,front,width=7){line([a,b],front?'#292331':'#211b29',width+3);line([a,b],front?'#b5afbf':'#777181',width);oval(...b,width*.58,width*.58,front?'#d5ced7':'#918697');}
  function leg(front,t,walking,drive=0){
    const phase=t*4.5+(front?0:Math.PI),hip=[front?5:-4,-64];
    // Positive local X points left after mirroring: the leading leg lunges left.
    const angle=walking?Math.sin(phase)*.36:front?.17+drive*.38:-.16-drive*.28;
    const bend=walking?.12+Math.max(0,Math.cos(phase))*.32:front?.04+drive*.24:.13+drive*.08;
    const knee=joint(hip,32,angle),ankle=joint(knee,31,angle-bend);
    bone(hip,knee,front,7);bone(knee,ankle,front,6);
    line([[ankle[0]-3,ankle[1]+3],[ankle[0]+14,ankle[1]+5]],front?'#c5bdce':'#82758b',6);
    for(let i=0;i<3;i++)line([[ankle[0]+6+i*4,ankle[1]+4],[ankle[0]+8+i*4,ankle[1]+8]],'#8a8093',1.4);
  }
  function robe(t,walking){
    const hem=walking?-9+Math.sin(t*8-.6)*5:0;
    path([[-17,-151],[10,-151],[21,-133],[13,-106],[16,-83],[26,-37],[18,-26],[12,-37],[2,-24],[-5,-37],[-18+hem,-23],[-21+hem,-38],[-35+hem,-29],[-27,-77],[-24,-114]],'#211a2d','#100e17',2);
    path([[-18,-144],[-10,-134],[-12,-95],[-20+hem,-38],[-30+hem,-32],[-24,-83]],'#12101c');
    path([[9,-143],[16,-132],[8,-111],[11,-83],[22,-37],[16,-34],[6,-80],[3,-112]],'#453052');
    line([[13,-142],[17,-133],[10,-108],[13,-83],[24,-37]],'#795098',2);
    line([[-7,-99],[-12,-67],[-18+hem,-37]],'#51405f',2);
    // Exposed neck, ribs and spine above the cape.
    line([[0,-155],[1,-111]],'#918599',4);
    for(let i=0;i<3;i++)line([[1,-136+i*8],[10,-133+i*8],[12,-128+i*8]],'#beb2c9',2.5);
    line([[-13,-102],[12,-103]],'#6d5480',4);oval(11,-103,3,5,'#c999f1');
  }
  function skull(t,p){
    path([[-13,-191],[-5,-202],[10,-201],[19,-190],[20,-181],[27,-174],[19,-170],[20,-157],[8,-153],[-9,-164],[-16,-179]],'#c7bfcc','#514453');
    path([[-13,-188],[-7,-193],[-7,-174],[2,-164],[1,-157],[-9,-164],[-16,-179]],'#827788');
    path([[10,-187],[21,-185],[20,-177],[11,-177],[7,-181]],'#24182f');
    path([[21,-175],[24,-171],[18,-171]],'#302333');
    line([[8,-163],[19,-163]],'#59435f',2);
    for(let i=0;i<4;i++)line([[9+i*3,-166],[9+i*3,-160]],'#5c4867',1);
    // Idle has no body motion; only the violet eye-light pulses.
    const light=.72+Math.sin(t*3)*.18+(mode==='doom'?Math.sin(p*Math.PI)*.3:0);
    ctx.save();ctx.globalAlpha=Math.min(1,light);glow(16,-181,17,'#ad43ffb0');line([[12,-182],[20,-182]],'#e9b5ff',3);ctx.restore();
    // The fitted band wraps the skull's curved top in side profile.
    path([[-14,-194],[-15,-211],[-8,-206],[-3,-222],[3,-208],[11,-217],[17,-194],[10,-197],[1,-200],[-7,-197]],'#17121f','#594264',1.5);
    path([[-14,-194],[-8,-201],[1,-204],[10,-201],[17,-194],[17,-189],[10,-196],[1,-198],[-7,-196],[-13,-189]],'#302338','#765487',1.5);
    glow(10,-202,12,'#a33cff90');
    path([[10,-208],[14,-202],[10,-196],[6,-202]],'#ab47ec','#e1a6ff',1.3);
    line([[10,-205],[12,-202],[10,-199]],'#f1ccff',1.3);
  }
  function drawArm(rig,front){bone(rig.shoulder,rig.elbow,front,7);bone(rig.elbow,rig.hand,front,6);}
  function hand(point,front){oval(...point,5,6,front?'#d2c7d9':'#93869f');for(let i=0;i<3;i++)line([[point[0]-3,point[1]-3+i*3],[point[0]+3,point[1]-2+i*3]],'#554360',1);}
  function weapon(pose,p){
    ctx.save();ctx.translate(pose.x,pose.y);ctx.scale(pose.projection,1);ctx.rotate(pose.angle);
    const power=mode==='doom'?ease(p/.28)*(1-ease((p-.8)/.2)):(attacks[mode] ? .65 : 0);
    ctx.shadowColor='#b94cff';ctx.shadowBlur=4+power*20;
    if(scythe.complete&&scythe.naturalWidth){ctx.drawImage(scythe,-gripPixel[0]*weaponScale,-gripPixel[1]*weaponScale,83*weaponScale,141*weaponScale);}
    else{
      line([[0,58],[-2,6],[4,-70],[-7,-128]],'#6a6072',6);
      path([[-25,-123],[29,-143],[65,-130],[87,-93],[48,-124],[24,-131]],'#93879d','#191221',2);
    }
    if(power>0){
      ctx.globalAlpha=power;
      line([[-5,-126],[34,-140],[72,-124],[87,-93]],'#dcb0ff',2);
      if(mode==='doom')for(let i=0;i<8;i++){
        const q=(p*3+i/8)%1;
        glow(Math.sin(q*TAU+i)*11,-126+q*178,9,'#c16bff90');
      }
    }
    ctx.restore();
  }
  function attackTrail(kind,p,current){
    const attack=attacks[kind];if(!attack||kind==='doom'||p<=attack.start||p>=attack.end+.16)return;
    const end=Math.min(p,attack.end),start=Math.max(attack.start,end-.12),points=[];
    for(let i=0;i<=24;i++){
      const sample=poseAt(kind,mix(start,end,i/24),time),tip=weaponPoint(sample,tipPixel);
      points.push([tip[0]+sample.lunge-current.lunge,tip[1]]);
    }
    ctx.save();ctx.globalAlpha=.8*(1-ease((p-attack.end)/.16));line(points,'#b45cff66',9);line(points,'#e5bbff',2);ctx.restore();
  }
  function tentacles(p){
    if(p<=.32)return;
    for(let i=0;i<5;i++){
      const growth=ease((p-.32-i*.025)/.18)*(1-ease((p-.80)/.20));if(growth<=0)continue;
      const x=74+i*39,height=(118+(i%3)*25)*growth,bend=Math.sin(p*12+i)*17;
      ctx.save();ctx.globalAlpha=growth;
      glow(x,0,30,'#aa42ff60');oval(x,0,23,5,'#12091c');
      ctx.beginPath();ctx.moveTo(x-9,0);
      ctx.bezierCurveTo(x-18,-height*.35,x+32+bend,-height*.68,x+6+bend,-height);
      ctx.bezierCurveTo(x+42+bend,-height*.72,x+2,-height*.25,x+9,0);
      ctx.closePath();ctx.fillStyle='#291239';ctx.fill();ctx.strokeStyle='#a45cdb';ctx.lineWidth=2;ctx.stroke();
      ctx.beginPath();ctx.moveTo(x,-4);ctx.bezierCurveTo(x-8,-height*.4,x+31+bend,-height*.7,x+6+bend,-height);
      ctx.strokeStyle='#db9dff';ctx.lineWidth=1.5;ctx.stroke();ctx.restore();
    }
  }
  function character(){
    const walking=mode==='walk',p=attacks[mode]?clamp(age/attacks[mode].duration):0,pose=poseAt(mode,p,time);
    const drive=mode==='sweep'||mode==='execute'?clamp(pose.lunge/(mode==='sweep'?30:22)):0;
    const bob=walking?-1-Math.abs(Math.sin(time*4.5)):drive*2;
    const front=arm(shoulders.front,[pose.x,pose.y]),rear=arm(shoulders.rear,weaponPoint(pose,rearPixel));
    oval(position-pose.lunge,417,48,8,'#09061099');
    // Mirror the entire rig and all combat effects: positive local X is left.
    ctx.save();ctx.translate(position-pose.lunge,410+bob);ctx.scale(-1,1);
    if(mode==='doom')tentacles(p);
    leg(false,time,walking,drive);drawArm(rear,false);leg(true,time,walking,drive);
    robe(walking?time*4.5/8:time,walking);skull(time,p);drawArm(front,true);
    attackTrail(mode,p,pose);weapon(pose,p);hand(rear.hand,false);hand(front.hand,true);
    ctx.restore();
  }
  function frame(now){
    const dt=last===null?0:Math.min((now-last)/1000,.05);last=now;time+=dt;age+=dt;
    if(attacks[mode]&&age>=attacks[mode].duration)select(stance);
    if(mode==='walk'){position-=dt*42;if(position<-150)position=950;}
    ctx.setTransform(canvas.width/800,0,0,canvas.height/500,0,0);background();character();requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange',()=>{last=null;});requestAnimationFrame(frame);
})();
</script>
</body>
</html>
