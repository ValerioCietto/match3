<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Wayfarer · Hero Animation</title>
<style>
  * { box-sizing:border-box }
  body { margin:0; min-height:100svh; display:grid; place-items:center; background:#10171b; color:#eee9da; font-family:system-ui,sans-serif; padding:24px }
  main { width:min(900px,100%) }
  header { display:flex; align-items:end; justify-content:space-between; gap:16px; margin-bottom:22px }
  .eyebrow { color:#c8ad73; font-size:11px; letter-spacing:.24em; text-transform:uppercase; margin:0 0 8px }
  h1 { font:400 clamp(28px,5vw,42px) Georgia,serif; margin:0 }
  .badge { color:#a8b8b6; border:1px solid #39464a; border-radius:30px; padding:8px 12px; font-size:11px; white-space:nowrap }
  .stage { position:relative; border:1px solid #425050; border-radius:16px; overflow:hidden; background:#18272b }
  canvas { display:block; width:100%; aspect-ratio:16/10 }
  .label { position:absolute; top:20px; left:22px; color:#afc3bd; font-size:10px; letter-spacing:.2em; pointer-events:none }
  .status { position:absolute; bottom:20px; left:22px; display:flex; align-items:center; gap:8px; font-size:11px; letter-spacing:.12em; text-transform:uppercase }
  .status::before { content:""; width:6px; height:6px; border-radius:50%; background:#e2be78; box-shadow:0 0 12px #e2be7880 }
  .controls { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:16px }
  .attacks { grid-template-columns:repeat(4,minmax(0,1fr)); margin-top:10px }
  .attacks button { flex-wrap:wrap; gap:8px; padding:10px }
  button { cursor:pointer; display:flex; justify-content:center; align-items:center; gap:12px; min-height:58px; border:1px solid #39474c; border-radius:10px; background:#1c272c; color:#d0dbd8; font:600 14px system-ui; transition:background .15s,border-color .15s }
  button:hover { background:#28373c }
  button[aria-pressed="true"] { background:#363528; border-color:#b49b62; color:#ffe0a0 }
  button:focus-visible { outline:2px solid #ffe0a0; outline-offset:4px }
  kbd { font:10px system-ui; color:#a2aaa2; border:1px solid #53605e; border-radius:4px; padding:2px 5px }
  footer { display:flex; justify-content:space-between; gap:16px; margin-top:16px; color:#8d9f9f; font-size:12px; line-height:1.6 }
  @media(max-width:640px) { .attacks { grid-template-columns:repeat(2,minmax(0,1fr)) } }
  @media(max-width:520px) { body { padding:16px } header { align-items:start } .badge { display:none } kbd { display:none } footer { flex-direction:column; gap:3px } .label { top:14px; left:14px } }
</style>
</head>
<body>
<main>
  <header><div><p class="eyebrow">Character study / 01</p><h1>The Wayfarer</h1></div><span class="badge">HUMAN · SWORDSMAN</span></header>
  <div class="stage">
    <canvas id="hero" role="img" aria-label="Animated human hero seen from the side, facing right, with a compact torso, wearing a blue tunic and armor, wielding a sword in a forest clearing.">Your browser needs canvas support to display the hero.</canvas>
    <div class="label">THE OLD FOREST / TRAINING GROUNDS</div>
    <div class="status" id="status" role="status">Idle · at the ready</div>
  </div>
  <div class="controls" role="group" aria-label="Hero stance">
    <button type="button" data-mode="idle" aria-pressed="true">Idle <kbd>I</kbd></button>
    <button type="button" data-mode="run" aria-pressed="false">run <kbd>R</kbd></button>
  </div>
  <div class="controls attacks" role="group" aria-label="Sword attacks">
    <button type="button" data-mode="attack" aria-pressed="false">Attack <kbd>1 / SPACE</kbd></button>
    <button type="button" data-mode="slash" aria-pressed="false">Slash <kbd>2</kbd></button>
    <button type="button" data-mode="piercer" aria-pressed="false">Heart Piercer <kbd>3</kbd></button>
    <button type="button" data-mode="cleave" aria-pressed="false">Cleave <kbd>4</kbd></button>
  </div>
  <footer><span>A steady breath. A quick stride. A clean strike.</span><span>Choose a stance, then draw your blade.</span></footer>
</main>
<script>
(() => {
  'use strict';
  const canvas = document.querySelector('#hero');
  const ctx = canvas.getContext('2d');
  const buttons = [...document.querySelectorAll('[data-mode]')];
  const status = document.querySelector('#status');
  const TAU = Math.PI * 2;
  let mode = 'idle', stance = 'idle', elapsed = 0, attackTime = 0, last = null, travel = 0;
  const attacks = {
    attack:{duration:.82,windup:.22,release:.58,label:'Attacking · sword slash'},
    slash:{duration:.94,windup:.32,release:.65,label:'Slash · overhead strike'},
    piercer:{duration:.52,windup:.24,release:.49,label:'Heart Piercer · lunging thrust'},
    cleave:{duration:.9,windup:.30,release:.66,label:'Cleave · horizontal slash'}
  };
  const mix = (a,b,t) => a + (b-a)*t;
  const smooth = t => { t = Math.max(0,Math.min(1,t)); return t*t*(3-2*t); };
  function setMode(next) {
    if(attacks[next]) { attackTime = 0; }
    else { stance = next; }
    mode = next;
    buttons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.mode === mode)));
    status.textContent = attacks[mode]?.label || {idle:'Idle · at the ready',run:'Running · onward'}[mode];
  }
  buttons.forEach(button => button.addEventListener('click', () => setMode(button.dataset.mode)));
  addEventListener('keydown', event => {
    if(event.altKey || event.ctrlKey || event.metaKey || /INPUT|TEXTAREA|SELECT/.test(event.target.tagName)) return;
    if(event.code === 'Space' && event.target.closest('button')) return;
    const next = {KeyI:'idle',KeyR:'run',Digit1:'attack',Digit2:'slash',Digit3:'piercer',Digit4:'cleave',Space:'attack'}[event.code];
    if(next) { event.preventDefault(); if(!event.repeat) setMode(next); }
  });
  function resize() {
    const width = canvas.getBoundingClientRect().width;
    const dpr = Math.min(window.devicePixelRatio || 1,2);
    canvas.width = Math.round(width*dpr);
    canvas.height = Math.round(width*10/16*dpr);
  }
  new ResizeObserver(resize).observe(canvas);
  resize();
  function shape(points,fill,stroke='#17282e',width=2) {
    ctx.beginPath(); ctx.moveTo(...points[0]);
    points.slice(1).forEach(point => ctx.lineTo(...point)); ctx.closePath();
    ctx.fillStyle=fill; ctx.fill();
    if(stroke) { ctx.strokeStyle=stroke; ctx.lineWidth=width; ctx.stroke(); }
  }
  function oval(x,y,rx,ry,fill) {
    ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,TAU); ctx.fillStyle=fill; ctx.fill();
  }
  function line(points,color,width) {
    ctx.beginPath(); ctx.moveTo(...points[0]); points.slice(1).forEach(point=>ctx.lineTo(...point));
    ctx.strokeStyle=color; ctx.lineWidth=width; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.stroke();
  }
  function joint(x,y,length,angle) { return [x+Math.sin(angle)*length,y+Math.cos(angle)*length]; }
  function background(t) {
    const sky = ctx.createLinearGradient(0,0,0,500);
    sky.addColorStop(0,'#172b32'); sky.addColorStop(.7,'#3c5653'); sky.addColorStop(1,'#253632');
    ctx.fillStyle=sky; ctx.fillRect(0,0,800,500);
    oval(575,116,43,43,'#cbd6b41a'); oval(575,116,30,30,'#cfddbf20');
    for(let layer=0;layer<2;layer++) {
      const spacing=105+layer*48;
      for(let i=-1;i<9;i++) {
        const offset=travel*(.06+layer*.09);
        const x=i*spacing-(offset%spacing);
        const base=332+layer*20, top=35+Math.sin(i*7+layer)*45;
        // Scale each tree around its roots to keep both layers grounded.
        const treeScale=.55+layer*.1;
        ctx.save(); ctx.translate(x,base); ctx.scale(treeScale,treeScale); ctx.translate(-x,-base);
        shape([[x-9-layer*4,base],[x-4,top],[x+7,top-15],[x+17+layer*4,base]],['#294341','#243c39'][layer],null);
        shape([[x-55,top+110],[x+3,top-35],[x+65,top+114]],['#294341','#243c39'][layer],null);
        ctx.restore();
      }
    }
    shape([[440,0],[496,0],[240,382],[110,382]],'#e4ebc307',null);
    shape([[635,0],[659,0],[493,382],[429,382]],'#e4ebc30a',null);
    const ground=ctx.createLinearGradient(0,355,0,500);
    ground.addColorStop(0,'#425249'); ground.addColorStop(1,'#1e302c');
    shape([[0,369],[190,355],[394,369],[650,351],[800,362],[800,500],[0,500]],ground,null);
    oval(399,417,240,48,'#aeb38a09');
    for(let i=0;i<40;i++) {
      const x=((i*137.3-travel)%850+850)%850-25, y=386+(i*31%112);
      line([[x-4,y],[x,y-4],[x+4,y]],'#70836b45',1.5);
    }
    for(let i=0;i<15;i++) {
      const x=(i*97+Math.sin(t*.3+i)*18)%800, y=120+(i*43%250)+Math.cos(t*.5+i)*13;
      oval(x,y,1.2,1.2,`rgba(227,218,155,${.16+.14*Math.sin(t+i)})`);
    }
  }
  // Ankle flexion relative to the shank: positive points the toes down.
  // Timing is adapted to this existing stride, not a new leg trajectory.
  // Reference: https://doi.org/10.1371/journal.pone.0270496 (Fig. 4).
  const ankleCurve = [[0,-.15],[.18,-.12],[.28,0],[.36,.08],[.43,-.12],[.50,-.38],[.56,-.08],[.62,.25],[.72,.08],[.875,-.24],[1,-.15]];
  function ankleRotation(shankAngle,phase) {
    if(mode!=='run') return 0;
    const curve=ankleCurve;
    const progress=((phase/TAU)%1+1)%1;
    for(let i=1;i<curve.length;i++) {
      const [end,value]=curve[i], [start,previous]=curve[i-1];
      if(progress<=end) {
        // Neutral is perpendicular to the shin; only the boot pivots.
        return -shankAngle+mix(previous,value,smooth((progress-start)/(end-start)));
      }
    }
  }
  function leg(hip,angle,bend,front,phase=0,hipDrop=0) {
    let knee=joint(...hip,43,angle);
    const ankle=joint(...knee,42,angle-bend);
    if(hipDrop>0) {
      // Settle the hip beneath the tunic, keeping the existing boot path and
      // limb lengths. This knee branch bends the shin clockwise on screen.
      hip=[hip[0],hip[1]+hipDrop];
      const dx=ankle[0]-hip[0], dy=ankle[1]-hip[1], distance=Math.hypot(dx,dy);
      const along=(43*43-42*42+distance*distance)/(2*distance);
      const height=Math.sqrt(Math.max(0,43*43-along*along));
      knee=[hip[0]+(dx*along+dy*height)/distance,
            hip[1]+(dy*along-dx*height)/distance];
    }
    line([hip,knee], '#14252c',25); line([hip,knee],front?'#344653':'#293943',19);
    oval(...knee,12,10,front?'#a8bbc0':'#738c94');
    line([knee,ankle],'#17262b',22); line([knee,ankle],front?'#6f858d':'#465e68',16);
    line([[knee[0]+3,knee[1]+6],[ankle[0]+3,ankle[1]-5]],front?'#b4c5c6':'#7f969a',3);
    ctx.save(); ctx.translate(...ankle); ctx.rotate(ankleRotation(angle-bend,phase));
    shape([[-10,-8],[8,-8],[13,3],[24,8],[23,15],[-11,15]],front?'#43392f':'#302e28');
    line([[-9,14],[22,14]],'#a99064',3);
    ctx.restore();
  }
  function sword(x,y,angle,projection=1) {
    ctx.save(); ctx.translate(x,y); ctx.rotate(angle);
    if(projection!==1) ctx.scale(1,projection);
    shape([[-5,-14],[-6,-96],[0,-114],[7,-96],[5,-14]],'#c7e1e5');
    shape([[0,-18],[0,-107],[7,-96],[5,-18]],'#799da9',null);
    line([[-3,-24],[-3,-93]],'#f1ffff',1.5);
    shape([[-20,-15],[-19,-21],[-7,-18],[7,-18],[19,-21],[21,-15],[9,-11],[-8,-11]],'#d4b36b');
    line([[0,-9],[0,12]],'#46332c',8);
    for(let i=0;i<4;i++) line([[-3,-6+i*5],[3,-3+i*5]],'#b09a73',1.5);
    oval(0,15,6,5,'#d4b36b'); ctx.restore();
  }
  const readyPose = {
    x:2+Math.sin(.35)*32+Math.sin(1)*30,
    y:-49+Math.cos(.35)*32+Math.cos(1)*30,
    blade:.3, drive:0, lunge:0, lean:0, reach:1
  };
  // Full arm length directly to the right of the shoulder after the lunge lean.
  const piercerThrust = {
    x:2*Math.cos(.09)+49*Math.sin(.09)+62,
    y:2*Math.sin(.09)-49*Math.cos(.09)
  };
  // New attacks share the resting pose but have independent wind-up, strike,
  // and recovery timing. Hand targets are measured from the body in screen axes.
  const attackMoves = {
    slash:[
      {at:0,...readyPose},
      {at:.32,...readyPose,x:24,y:-100,blade:-.25,lean:-.06},
      {at:.40,...readyPose,x:24,y:-100,blade:-.25,lean:-.06},
      {at:.57,...readyPose,x:51,y:-12,blade:1.70,drive:1,lunge:20,lean:.10},
      {at:.65,...readyPose,x:51,y:-12,blade:1.70,drive:1,lunge:20,lean:.10},
      {at:1,...readyPose}
    ],
    piercer:[
      {at:0,...readyPose},
      {at:.24,...readyPose,x:12,y:-49,blade:Math.PI/2,lunge:-8,lean:-.04},
      {at:.36,...readyPose,...piercerThrust,blade:Math.PI/2,drive:1,lunge:46,lean:.09},
      {at:.49,...readyPose,...piercerThrust,blade:Math.PI/2,drive:1,lunge:46,lean:.09},
      {at:.72,...readyPose,x:22,y:-49,blade:Math.PI/2,drive:.25,lunge:10,lean:.02},
      {at:1,...readyPose}
    ],
    cleave:[
      {at:0,...readyPose},
      {at:.30,...readyPose,x:10,y:-34,blade:Math.PI/2,reach:-.8,lunge:-5,lean:-.05},
      {at:.57,...readyPose,x:57,y:-34,blade:Math.PI/2,reach:1,drive:1,lunge:18,lean:.08},
      {at:.66,...readyPose,x:57,y:-34,blade:Math.PI/2,reach:1,drive:1,lunge:18,lean:.08},
      {at:1,...readyPose}
    ]
  };
  function attackPose(kind,progress) {
    const frames=attackMoves[kind];
    for(let i=1;i<frames.length;i++) {
      const a=frames[i-1], b=frames[i];
      if(progress<=b.at) {
        const blend=smooth((progress-a.at)/(b.at-a.at)), pose={};
        for(const key of Object.keys(readyPose)) pose[key]=mix(a[key],b[key],blend);
        return pose;
      }
    }
    return {...readyPose};
  }
  function attackArm(pose) {
    // Solve only the new attack arm; existing idle, run, and attack keep their rig.
    const c=Math.cos(pose.lean), s=Math.sin(pose.lean);
    const hand=[c*pose.x+s*pose.y,-s*pose.x+c*pose.y];
    const dx=hand[0]-2, dy=hand[1]+49, distance=Math.hypot(dx,dy);
    const reach=Math.max(.001,Math.min(62,distance));
    const along=(32*32-30*30+reach*reach)/(2*reach);
    const bend=Math.sqrt(Math.max(0,32*32-along*along));
    const elbow=[2+dx/distance*along-dy/distance*bend,
                 -49+dy/distance*along+dx/distance*bend];
    return {elbow,hand};
  }
  function originalAttackPose(p) {
    const strike=smooth((p-.22)/.24), recover=smooth((p-.58)/.42);
    const drive=strike*(1-recover), wind=smooth(p/.22)*(1-strike);
    let upper=mix(.35,2.85,wind), fore=mix(1,3.65,wind), blade=mix(.3,-1.3,wind);
    upper=mix(upper,1.1,drive); fore=mix(fore,1.8,drive); blade=mix(blade,2.05,drive);
    const elbow=joint(2,-49,32,upper), hand=joint(...elbow,30,fore);
    const lean=drive*.12, c=Math.cos(lean), s=Math.sin(lean);
    return {upper,fore,blade,drive,lean,lunge:drive*28,
      x:c*hand[0]-s*hand[1],y:s*hand[0]+c*hand[1]};
  }
  function attackTrail(kind,p,pose,t) {
    const start={attack:.22,slash:.40,piercer:.24,cleave:.30}[kind];
    const end={attack:.58,slash:.70,piercer:.53,cleave:.67}[kind];
    if(p<=start || p>=end) return;
    ctx.save(); ctx.rotate(-pose.lean);
    ctx.globalAlpha=Math.sin((p-start)/(end-start)*Math.PI)*.65;
    if(kind==='slash' || kind==='attack') {
      const outer=[], inner=[];
      for(let i=0;i<=12;i++) {
        const q=mix(Math.max(start,p-.14),Math.min(p,kind==='attack'?.46:.65),i/12);
        const sample=kind==='attack'?originalAttackPose(q):attackPose(kind,q);
        const x=sample.x+sample.lunge-pose.lunge;
        // Attack 1's blade is body-relative; follow its historical lean,
        // lunge, and breathing offset so the ribbon traces the actual cut.
        const angle=sample.blade+(kind==='attack'?sample.lean:0);
        const bobOffset=kind==='attack'?
          (Math.sin((t-(p-q)*attacks.attack.duration)*2.5)-Math.sin(t*2.5))*1.7:0;
        const y=sample.y+bobOffset;
        outer.push([x+Math.sin(angle)*114,y-Math.cos(angle)*114]);
        inner.push([x+Math.sin(angle)*82,y-Math.cos(angle)*82]);
      }
      shape([...outer,...inner.reverse()],'#dcf5ef66',null);
      line(outer,'#efffec',2);
    } else if(kind==='piercer') {
      line([[pose.x-30,-54],[pose.x+116,-54]],'#efffec',2);
      line([[pose.x-52,-44],[pose.x+88,-44]],'#dcf5ef88',2);
    } else {
      const angle=mix(Math.PI,TAU,smooth((p-.30)/.27));
      const tail=Math.max(Math.PI,angle-1.25);
      ctx.beginPath(); ctx.ellipse(28,-34,128,20,0,tail,angle);
      ctx.ellipse(28,-34,105,12,0,angle,tail,true); ctx.closePath();
      ctx.fillStyle='#dcf5ef66'; ctx.fill();
      ctx.beginPath(); ctx.ellipse(28,-34,129,20,0,tail,angle);
      ctx.strokeStyle='#efffec'; ctx.lineWidth=2; ctx.stroke();
    }
    ctx.restore();
  }
  function hero(t) {
    const running=mode==='run', attacking=Boolean(attacks[mode]), cycle=t*10;
    const idle=mode==='idle';
    const idleFlex=idle?(1-Math.cos(t*1.8))*.5:0;
    const idleElbow=idle?Math.sin(t*1.8)*.012:0;
    const p=attacking?attackTime/attacks[mode].duration:0;
    const pose=attackMoves[mode]?attackPose(mode,p):null;
    const original=mode==='attack'?originalAttackPose(p):null;
    const action=pose?pose.drive:original?original.drive:0;
    const attackLoad=attacking?smooth(p/attacks[mode].windup)*
      (1-smooth((p-attacks[mode].release)/(1-attacks[mode].release))):0;
    // Load both knees in anticipation, flex the leading knee into the strike,
    // and release smoothly as the sword recovers. Idle/run keep their poses.
    const rearKneeDrop=attacking?3*attackLoad*(1-action)+2*action:idleFlex*.08;
    const frontKneeDrop=attacking?2.5*attackLoad+5.5*action:idleFlex*.04;
    const bob=running ? -5-Math.abs(Math.sin(cycle))*7 : attacking?Math.sin(t*2.5)*1.7:0;
    const lunge=pose?pose.lunge:attacking ? action*28 : 0;
    oval(398+lunge,421,running?49:57,running?9:11,'#0c1a2380');
    ctx.save(); ctx.translate(387+lunge,324+bob); ctx.rotate(pose?pose.lean:running?.1:attacking?action*.12:0);
    leg([-4,4],running?Math.sin(cycle+Math.PI)*.85:attacking?-.25-action*.38:-.16,running?.3+Math.max(0,Math.cos(cycle+Math.PI))*1.25:.13,false,cycle+Math.PI,rearKneeDrop);
    // Rear arm and glove.
    const rearElbow=joint(-5,-49,32,running?-.65*Math.sin(cycle)-.3:.2-action*.7+idleElbow);
    const rearHand=joint(...rearElbow,28,-.3-idleElbow);
    line([[-5,-49],rearElbow],'#1c303b',21); line([[-5,-49],rearElbow],'#2a5d73',15);
    line([rearElbow,rearHand],'#687f88',14); oval(...rearHand,8,9,'#654b39');
    leg([5,5],running?Math.sin(cycle)*.85:attacking?.17+action*.55:.17,running?.3+Math.max(0,Math.cos(cycle))*1.25:.04,true,cycle,frontKneeDrop);
    // Compact torso in profile, with the chest facing right.
    ctx.save(); ctx.scale(.62,.78);
    // Split tunic, fitted breastplate, leather belt, and brass trim.
    shape([[-25,-36],[23,-36],[34,25],[8,30],[0,13],[-6,30],[-31,23]],'#286781');
    line([[-29,22],[-7,27],[0,12],[9,27],[31,23]],'#c0a269',3);
    shape([[-26,-77],[9,-82],[27,-67],[23,-28],[-25,-28],[-31,-60]],'#376d86');
    shape([[-22,-74],[10,-77],[23,-64],[18,-40],[-17,-38],[-26,-59]],'#91a9b0');
    shape([[-22,-73],[-7,-70],[-3,-40],[-17,-38],[-26,-59]],'#597780',null);
    line([[-5,-69],[14,-67],[12,-47]],'#d9e5de',2);
    shape([[-25,-34],[25,-34],[26,-24],[-26,-24]],'#4c392f');
    ctx.restore();
    // Right-facing profile: one eye, a projecting nose, and a visible ear.
    ctx.save(); ctx.translate(0,17);
    shape([[-8,-97],[9,-97],[11,-80],[2,-73],[-10,-81]],'#c38e68');
    shape([[-17,-124],[4,-132],[16,-122],[17,-111],[27,-103],[18,-100],[20,-96],[16,-88],[4,-85],[-13,-96]],'#e3b68c');
    shape([[-14,-112],[-7,-108],[-6,-94],[6,-87],[-1,-86],[-13,-96]],'#bd805f',null);
    oval(-4,-106,5,7,'#e3b68c');
    shape([[-19,-108],[-23,-127],[-15,-140],[-3,-138],[6,-146],[15,-137],[25,-129],[20,-118],[8,-122],[-1,-126],[-9,-115],[-11,-102]],'#3c302b');
    line([[-16,-127],[-5,-134],[9,-133]],'#78604a',3);
    line([[12,-113],[19,-113]],'#614439',2);
    oval(17,-110,1.6,2,'#1e3034'); line([[13,-95],[19,-96]],'#8f5c49',1.5);
    ctx.restore();
    // Leading sword arm: anticipation, fast cut, then recovery.
    let upper=running?.5+Math.sin(cycle)*.45:.35, fore=running?1.8:1.0, blade=running?.55:.3;
    upper+=idleElbow; fore-=idleElbow*.8;
    if(original) {
      ({upper,fore,blade}=original);
    }
    let elbow, hand;
    if(pose) {
      ({elbow,hand}=attackArm(pose));
      blade=pose.blade-pose.lean;
    } else {
      elbow=joint(2,-49,32,upper); hand=joint(...elbow,30,fore);
    }
    line([[2,-49],elbow],'#152831',23); line([[2,-49],elbow],'#2e657d',17);
    oval(2,-52,12,11,'#a9bdc1'); line([[-8,-55],[2,-61],[12,-56]],'#e2e8d9',2);
    line([elbow,hand],'#1b3038',19); line([elbow,hand],'#819fa9',14);
    line([[elbow[0]+3,elbow[1]],[hand[0]+3,hand[1]]],'#c6d8d9',3);
    if(pose || original) attackTrail(mode,p,pose || original,t);
    sword(...hand,blade,pose?pose.reach:1); oval(...hand,9,8,'#6e503a');
    ctx.restore();
    if(running) {
      for(let i=0;i<5;i++) { const q=(t*2+i/5)%1; oval(368-q*80,424-q*13,3+q*8,1+q*3,`rgba(184,172,130,${(1-q)*.22})`); }
    }
  }
  function frame(now) {
    const dt=last===null?0:Math.min((now-last)/1000,.05); last=now; elapsed+=dt;
    if(attacks[mode]) { attackTime+=dt; if(attackTime>=attacks[mode].duration) setMode(stance); }
    if(mode==='run') travel+=dt*160;
    ctx.setTransform(canvas.width/800,0,0,canvas.height/500,0,0);
    background(elapsed); hero(elapsed);
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange',()=>{ last=null; });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
