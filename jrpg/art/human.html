<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Wayfarer · Hero Animation</title>
<style>
  * { box-sizing:border-box }
  body { margin:0; min-height:100svh; display:grid; place-items:center; background:#10171b; color:#eee9da; font-family:system-ui,sans-serif; padding:24px }
  main { width:min(900px,100%) }
  header { display:flex; align-items:end; justify-content:space-between; gap:16px; margin-bottom:22px }
  .eyebrow { color:#c8ad73; font-size:11px; letter-spacing:.24em; text-transform:uppercase; margin:0 0 8px }
  h1 { font:400 clamp(28px,5vw,42px) Georgia,serif; margin:0 }
  .badge { color:#a8b8b6; border:1px solid #39464a; border-radius:30px; padding:8px 12px; font-size:11px; white-space:nowrap }
  .stage { position:relative; border:1px solid #425050; border-radius:16px; overflow:hidden; background:#18272b }
  canvas { display:block; width:100%; aspect-ratio:16/10 }
  .label { position:absolute; top:20px; left:22px; color:#afc3bd; font-size:10px; letter-spacing:.2em; pointer-events:none }
  .status { position:absolute; bottom:20px; left:22px; display:flex; align-items:center; gap:8px; font-size:11px; letter-spacing:.12em; text-transform:uppercase }
  .status::before { content:""; width:6px; height:6px; border-radius:50%; background:#e2be78; box-shadow:0 0 12px #e2be7880 }
  .controls { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:16px }
  button { cursor:pointer; display:flex; justify-content:center; align-items:center; gap:12px; min-height:58px; border:1px solid #39474c; border-radius:10px; background:#1c272c; color:#d0dbd8; font:600 14px system-ui; transition:background .15s,border-color .15s }
  button:hover { background:#28373c }
  button[aria-pressed="true"] { background:#363528; border-color:#b49b62; color:#ffe0a0 }
  button:focus-visible { outline:2px solid #ffe0a0; outline-offset:4px }
  kbd { font:10px system-ui; color:#a2aaa2; border:1px solid #53605e; border-radius:4px; padding:2px 5px }
  footer { display:flex; justify-content:space-between; gap:16px; margin-top:16px; color:#8d9f9f; font-size:12px; line-height:1.6 }
  @media(max-width:520px) { body { padding:16px } header { align-items:start } .badge { display:none } kbd { display:none } footer { flex-direction:column; gap:3px } .label { top:14px; left:14px } }
</style>
</head>
<body>
<main>
  <header><div><p class="eyebrow">Character study / 01</p><h1>The Wayfarer</h1></div><span class="badge">HUMAN · SWORDSMAN</span></header>
  <div class="stage">
    <canvas id="hero" role="img" aria-label="Animated human hero seen from the side, facing right, with a compact torso, wearing a blue tunic and armor, wielding a sword in a forest clearing.">Your browser needs canvas support to display the hero.</canvas>
    <div class="label">THE OLD FOREST / TRAINING GROUNDS</div>
    <div class="status" id="status" role="status">Idle · at the ready</div>
  </div>
  <div class="controls" role="group" aria-label="Hero animation">
    <button type="button" data-mode="idle" aria-pressed="true">Idle <kbd>1</kbd></button>
    <button type="button" data-mode="run" aria-pressed="false">Run <kbd>2</kbd></button>
    <button type="button" data-mode="attack" aria-pressed="false">Attack <kbd>SPACE</kbd></button>
  </div>
  <footer><span>A steady breath. A quick stride. A clean strike.</span><span>Choose a stance, then draw your blade.</span></footer>
</main>
<script>
(() => {
  'use strict';
  const canvas = document.querySelector('#hero');
  const ctx = canvas.getContext('2d');
  const buttons = [...document.querySelectorAll('[data-mode]')];
  const status = document.querySelector('#status');
  const TAU = Math.PI * 2;
  let mode = 'idle', stance = 'idle', elapsed = 0, attackTime = 0, last = null, travel = 0;
  const attackDuration = .82;
  const mix = (a,b,t) => a + (b-a)*t;
  const smooth = t => { t = Math.max(0,Math.min(1,t)); return t*t*(3-2*t); };
  function setMode(next) {
    if(next === 'attack') { attackTime = 0; }
    else { stance = next; }
    mode = next;
    buttons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.mode === mode)));
    status.textContent = {idle:'Idle · at the ready',run:'Running · onward',attack:'Attacking · sword slash'}[mode];
  }
  buttons.forEach(button => button.addEventListener('click', () => setMode(button.dataset.mode)));
  addEventListener('keydown', event => {
    if(event.altKey || event.ctrlKey || event.metaKey || /INPUT|TEXTAREA|SELECT/.test(event.target.tagName)) return;
    if(event.code === 'Space' && event.target.closest('button')) return;
    const next = {Digit1:'idle',Digit2:'run',Digit3:'attack',Space:'attack'}[event.code];
    if(next) { event.preventDefault(); if(!event.repeat) setMode(next); }
  });
  function resize() {
    const width = canvas.getBoundingClientRect().width;
    const dpr = Math.min(window.devicePixelRatio || 1,2);
    canvas.width = Math.round(width*dpr);
    canvas.height = Math.round(width*10/16*dpr);
  }
  new ResizeObserver(resize).observe(canvas);
  resize();
  function shape(points,fill,stroke='#17282e',width=2) {
    ctx.beginPath(); ctx.moveTo(...points[0]);
    points.slice(1).forEach(point => ctx.lineTo(...point)); ctx.closePath();
    ctx.fillStyle=fill; ctx.fill();
    if(stroke) { ctx.strokeStyle=stroke; ctx.lineWidth=width; ctx.stroke(); }
  }
  function oval(x,y,rx,ry,fill) {
    ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,TAU); ctx.fillStyle=fill; ctx.fill();
  }
  function line(points,color,width) {
    ctx.beginPath(); ctx.moveTo(...points[0]); points.slice(1).forEach(point=>ctx.lineTo(...point));
    ctx.strokeStyle=color; ctx.lineWidth=width; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.stroke();
  }
  function joint(x,y,length,angle) { return [x+Math.sin(angle)*length,y+Math.cos(angle)*length]; }
  function background(t) {
    const sky = ctx.createLinearGradient(0,0,0,500);
    sky.addColorStop(0,'#172b32'); sky.addColorStop(.7,'#3c5653'); sky.addColorStop(1,'#253632');
    ctx.fillStyle=sky; ctx.fillRect(0,0,800,500);
    oval(575,116,43,43,'#cbd6b41a'); oval(575,116,30,30,'#cfddbf20');
    for(let layer=0;layer<2;layer++) {
      const spacing=105+layer*48;
      for(let i=-1;i<9;i++) {
        const offset=travel*(.06+layer*.09);
        const x=i*spacing-(offset%spacing);
        const base=332+layer*20, top=35+Math.sin(i*7+layer)*45;
        // Scale each tree around its roots to keep both layers grounded.
        const treeScale=.55+layer*.1;
        ctx.save(); ctx.translate(x,base); ctx.scale(treeScale,treeScale); ctx.translate(-x,-base);
        shape([[x-9-layer*4,base],[x-4,top],[x+7,top-15],[x+17+layer*4,base]],['#294341','#243c39'][layer],null);
        shape([[x-55,top+110],[x+3,top-35],[x+65,top+114]],['#294341','#243c39'][layer],null);
        ctx.restore();
      }
    }
    shape([[440,0],[496,0],[240,382],[110,382]],'#e4ebc307',null);
    shape([[635,0],[659,0],[493,382],[429,382]],'#e4ebc30a',null);
    const ground=ctx.createLinearGradient(0,355,0,500);
    ground.addColorStop(0,'#425249'); ground.addColorStop(1,'#1e302c');
    shape([[0,369],[190,355],[394,369],[650,351],[800,362],[800,500],[0,500]],ground,null);
    oval(399,417,240,48,'#aeb38a09');
    for(let i=0;i<40;i++) {
      const x=((i*137.3-travel)%850+850)%850-25, y=386+(i*31%112);
      line([[x-4,y],[x,y-4],[x+4,y]],'#70836b45',1.5);
    }
    for(let i=0;i<15;i++) {
      const x=(i*97+Math.sin(t*.3+i)*18)%800, y=120+(i*43%250)+Math.cos(t*.5+i)*13;
      oval(x,y,1.2,1.2,`rgba(227,218,155,${.16+.14*Math.sin(t+i)})`);
    }
  }
  function leg(hip,angle,bend,front) {
    const knee=joint(...hip,43,angle), ankle=joint(...knee,42,angle-bend);
    line([hip,knee], '#14252c',25); line([hip,knee],front?'#344653':'#293943',19);
    oval(...knee,12,10,front?'#a8bbc0':'#738c94');
    line([knee,ankle],'#17262b',22); line([knee,ankle],front?'#6f858d':'#465e68',16);
    line([[knee[0]+3,knee[1]+6],[ankle[0]+3,ankle[1]-5]],front?'#b4c5c6':'#7f969a',3);
    shape([[ankle[0]-10,ankle[1]-8],[ankle[0]+8,ankle[1]-8],[ankle[0]+13,ankle[1]+3],[ankle[0]+24,ankle[1]+8],[ankle[0]+23,ankle[1]+15],[ankle[0]-11,ankle[1]+15]],front?'#43392f':'#302e28');
    line([[ankle[0]-9,ankle[1]+14],[ankle[0]+22,ankle[1]+14]],'#a99064',3);
  }
  function sword(x,y,angle) {
    ctx.save(); ctx.translate(x,y); ctx.rotate(angle);
    shape([[-5,-14],[-6,-96],[0,-114],[7,-96],[5,-14]],'#c7e1e5');
    shape([[0,-18],[0,-107],[7,-96],[5,-18]],'#799da9',null);
    line([[-3,-24],[-3,-93]],'#f1ffff',1.5);
    shape([[-20,-15],[-19,-21],[-7,-18],[7,-18],[19,-21],[21,-15],[9,-11],[-8,-11]],'#d4b36b');
    line([[0,-9],[0,12]],'#46332c',8);
    for(let i=0;i<4;i++) line([[-3,-6+i*5],[3,-3+i*5]],'#b09a73',1.5);
    oval(0,15,6,5,'#d4b36b'); ctx.restore();
  }
  function hero(t) {
    const running=mode==='run', attacking=mode==='attack', cycle=t*10;
    const p=attackTime/attackDuration;
    const strike=smooth((p-.22)/.24), recover=smooth((p-.58)/.42);
    const action=strike*(1-recover);
    const bob=running ? -5-Math.abs(Math.sin(cycle))*7 : Math.sin(t*2.5)*1.7;
    const lunge=attacking ? action*28 : 0;
    oval(398+lunge,421,running?49:57,running?9:11,'#0c1a2380');
    ctx.save(); ctx.translate(387+lunge,324+bob); ctx.rotate(running?.1:attacking?action*.12:0);
    leg([-4,4],running?Math.sin(cycle+Math.PI)*.85:attacking?-.25-action*.38:-.16,running?.3+Math.max(0,Math.cos(cycle+Math.PI))*1.25:.13,false);
    // Rear arm and glove.
    const rearElbow=joint(-5,-49,32,running?-.65*Math.sin(cycle)-.3:.2-action*.7);
    const rearHand=joint(...rearElbow,28,-.3);
    line([[-5,-49],rearElbow],'#1c303b',21); line([[-5,-49],rearElbow],'#2a5d73',15);
    line([rearElbow,rearHand],'#687f88',14); oval(...rearHand,8,9,'#654b39');
    leg([5,5],running?Math.sin(cycle)*.85:attacking?.17+action*.55:.17,running?.3+Math.max(0,Math.cos(cycle))*1.25:.04,true);
    // Compact torso in profile, with the chest facing right.
    ctx.save(); ctx.scale(.62,.78);
    // Split tunic, fitted breastplate, leather belt, and brass trim.
    shape([[-25,-36],[23,-36],[34,25],[8,30],[0,13],[-6,30],[-31,23]],'#286781');
    line([[-29,22],[-7,27],[0,12],[9,27],[31,23]],'#c0a269',3);
    shape([[-26,-77],[9,-82],[27,-67],[23,-28],[-25,-28],[-31,-60]],'#376d86');
    shape([[-22,-74],[10,-77],[23,-64],[18,-40],[-17,-38],[-26,-59]],'#91a9b0');
    shape([[-22,-73],[-7,-70],[-3,-40],[-17,-38],[-26,-59]],'#597780',null);
    line([[-5,-69],[14,-67],[12,-47]],'#d9e5de',2);
    shape([[-25,-34],[25,-34],[26,-24],[-26,-24]],'#4c392f');
    shape([[-3,-35],[9,-35],[9,-23],[-3,-23]],'#cbae65');
    shape([[0,-32],[6,-32],[6,-26],[0,-26]],'#493c31',null);
    line([[-20,-76],[16,-37]],'#695041',6);
    oval(-18,-74,5,5,'#dec387');
    ctx.restore();
    // Right-facing profile: one eye, a projecting nose, and a visible ear.
    ctx.save(); ctx.translate(0,17);
    shape([[-8,-97],[9,-97],[11,-80],[2,-73],[-10,-81]],'#c38e68');
    shape([[-17,-124],[4,-132],[16,-122],[17,-111],[27,-103],[18,-100],[20,-96],[16,-88],[4,-85],[-13,-96]],'#e3b68c');
    shape([[-14,-112],[-7,-108],[-6,-94],[6,-87],[-1,-86],[-13,-96]],'#bd805f',null);
    oval(-4,-106,5,7,'#e3b68c');
    shape([[-19,-108],[-23,-127],[-15,-140],[-3,-138],[6,-146],[15,-137],[25,-129],[20,-118],[8,-122],[-1,-126],[-9,-115],[-11,-102]],'#3c302b');
    line([[-16,-127],[-5,-134],[9,-133]],'#78604a',3);
    line([[12,-113],[19,-113]],'#614439',2);
    oval(17,-110,1.6,2,'#1e3034'); line([[13,-95],[19,-96]],'#8f5c49',1.5);
    ctx.restore();
    // Leading sword arm: anticipation, fast cut, then recovery.
    let upper=running?.5+Math.sin(cycle)*.45:.35, fore=running?1.8:1.0, blade=running?.55:.3;
    if(attacking) {
      const wind=smooth(p/.22)*(1-strike);
      upper=mix(.35,2.85,wind); fore=mix(1,3.65,wind); blade=mix(.3,-1.3,wind);
      upper=mix(upper,1.1,action); fore=mix(fore,1.8,action); blade=mix(blade,2.05,action);
    }
    const elbow=joint(2,-49,32,upper), hand=joint(...elbow,30,fore);
    line([[2,-49],elbow],'#152831',23); line([[2,-49],elbow],'#2e657d',17);
    oval(2,-52,12,11,'#a9bdc1'); line([[-8,-55],[2,-61],[12,-56]],'#e2e8d9',2);
    line([elbow,hand],'#1b3038',19); line([elbow,hand],'#819fa9',14);
    line([[elbow[0]+3,elbow[1]],[hand[0]+3,hand[1]]],'#c6d8d9',3);
    sword(...hand,blade); oval(...hand,9,8,'#6e503a');
    if(attacking && p>.25 && p<.59) {
      ctx.save(); ctx.globalAlpha=Math.sin((p-.25)/.34*Math.PI)*.7;
      ctx.beginPath(); ctx.arc(27,-57,117,-1.15,1.1); ctx.arc(27,-57,91,1.1,-1.15,true); ctx.closePath();
      ctx.fillStyle='#dcf5ef66'; ctx.fill();
      ctx.beginPath(); ctx.arc(27,-57,119,-.95,1.05); ctx.strokeStyle='#efffec'; ctx.lineWidth=3; ctx.stroke(); ctx.restore();
    }
    ctx.restore();
    if(running) {
      for(let i=0;i<5;i++) { const q=(t*2+i/5)%1; oval(368-q*80,424-q*13,3+q*8,1+q*3,`rgba(184,172,130,${(1-q)*.22})`); }
    }
  }
  function frame(now) {
    const dt=last===null?0:Math.min((now-last)/1000,.05); last=now; elapsed+=dt;
    if(mode==='attack') { attackTime+=dt; if(attackTime>=attackDuration) setMode(stance); }
    if(mode==='run') travel+=dt*160;
    ctx.setTransform(canvas.width/800,0,0,canvas.height/500,0,0);
    background(elapsed); hero(elapsed);
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange',()=>{ last=null; });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
