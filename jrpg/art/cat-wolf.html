<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cat-Wolf · Canvas Animation</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:#11131e;color:#e4e8f1;font-family:system-ui,sans-serif}
main{width:min(900px,100%)}
.character-links{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:24px;font-size:13px}
a{color:#bba1d5;text-underline-offset:4px}a[aria-current]{color:#fff;font-weight:700}
header{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:20px}
.eyebrow{margin:0 0 8px;color:#bca4d9;font-size:11px;letter-spacing:.24em;text-transform:uppercase}
h1{margin:0;font:400 clamp(30px,5vw,44px) Georgia,serif}
.badge{border:1px solid #42465f;border-radius:24px;padding:8px 12px;font-size:11px;color:#aeb8d0}
.stage{position:relative;overflow:hidden;border:1px solid #42465f;border-radius:16px;background:#1a2333}
canvas{display:block;width:100%;aspect-ratio:16/10}
.label,.status{position:absolute;left:22px;font-size:10px;letter-spacing:.18em;pointer-events:none}
.label{top:20px;color:#b2c6d7}.status{bottom:20px;color:#d5c4ef;text-transform:uppercase}
.status:before{content:'';display:inline-block;width:6px;height:6px;background:#bb9ee3;border-radius:50%;margin-right:10px;box-shadow:0 0 12px #bb9ee3}
.controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:16px}
button{min-height:56px;border:1px solid #42465f;border-radius:10px;background:#22283c;color:#d9e1ef;font:600 14px system-ui;cursor:pointer}
button:hover{background:#343954}button[aria-pressed=true]{background:#423956;border-color:#ac91cc}
button:focus-visible,a:focus-visible{outline:2px solid #dbbdf6;outline-offset:4px}
kbd{margin-left:8px;font:10px system-ui;color:#b4b6ce;border:1px solid #586078;border-radius:4px;padding:2px 5px}
footer{display:flex;justify-content:space-between;gap:12px;margin-top:16px;font-size:12px;color:#9ca9bf;line-height:1.6}
@media(max-width:520px){body{padding:16px}.badge,kbd{display:none}.controls{grid-template-columns:repeat(2,1fr)}footer{flex-direction:column;gap:2px}.label,.status{left:14px;font-size:9px}}
</style>
<link rel="stylesheet" href="menu.css">
<script src="menu.js" defer></script>
</head>
<body>
<main>
  <div data-art-menu><a class="art-menu-fallback" href="menu.html">Browse Characters, Enemies and Scenery</a></div>
  <header><div><p class="eyebrow">Enemy study / Feral</p><h1>The Cat-Wolf</h1></div><span class="badge">SHE-WOLF &middot; FELINE FURY</span></header>
  <div class="stage">
    <canvas id="cat-wolf" role="img" aria-label="A female cat-wolf monster on four legs, with a feline head, shaggy wolf body, bushy tail and trousers covering her hindquarters.">Canvas support is needed to display the cat-wolf.</canvas>
    <div class="label">THE MOONLIT TRAIL / FELINE FURY</div>
    <div class="status" id="status" role="status">Idle &middot; she is watching you</div>
  </div>
  <div class="controls" role="group" aria-label="Cat-Wolf animations">
    <button type="button" data-mode="idle" aria-pressed="true">Idle <kbd>I</kbd></button>
    <button type="button" data-mode="run" aria-pressed="false">Run <kbd>R</kbd></button>
    <button type="button" data-mode="attack" aria-pressed="false">Claw attack <kbd>A</kbd></button>
    <button type="button" data-mode="away" aria-pressed="false">Run away <kbd>F</kbd></button>
  </div>
  <footer><span>A cat?s stare. A wolf?s stride.</span><span>Choose another animation to bring her back.</span></footer>
</main>
<script src="cat-wolf-scene.js"></script>
</body></html>
