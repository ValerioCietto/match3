<!doctype html><html lang="en"><meta charset="utf-8"><title>Cargo pod preview</title><style>body{margin:0;background:#152330;color:#dce8ec;font:14px system-ui}h1,p{margin:18px 28px}canvas{width:900px;height:600px;display:block}</style><h1>Cargo pod · Container details</h1><p id="result">RUNNING</p><canvas id="scene" width="900" height="600"></canvas><script type="module">
import {WebGLRenderer} from './webgl-renderer.js';import {part,combined,mesh} from './model.js';
try{const p=part('cargo'),m=mesh(p);for(const v of m.vertices)if(v.some((n,i)=>Math.abs(n)>[.55,.425,.9][i]+1e-9))throw Error('Original bounds exceeded');const r=new WebGLRenderer(document.getElementById('scene'));r.setModel(combined([p]));r.render({yaw:2.55,pitch:.35,distance:3.1,width:900,height:600,grid:false,wireframe:false});const pixels=new Uint8Array(900*600*4);r.gl.readPixels(0,0,900,600,r.gl.RGBA,r.gl.UNSIGNED_BYTE,pixels);if(!pixels.some((v,i)=>i%4===3&&v>0)||r.gl.getError())throw Error('WebGL render failed');document.getElementById('result').textContent='PASS: detailed cargo renders and preserves original dimensions';}catch(e){document.getElementById('result').textContent='FAIL: '+e.message;}
</script></html>
