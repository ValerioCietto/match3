<!doctype html><html lang="en"><meta charset="utf-8"><title>Builder smoke test</title><body><pre id="result">RUNNING</pre><iframe src="./" width="1400" height="1000"></iframe><script type="module">
const frame=document.querySelector('iframe');
frame.onload=async()=>{try{await new Promise(r=>setTimeout(r,800));const d=frame.contentDocument,$=id=>d.getElementById(id),check=(value,message)=>{if(!value)throw Error(message);};
check($('renderError').hidden,'WebGL initialization');check($('assembly').children.length>0,'Initial assembly');const initial=$('assembly').children.length;
$('parts').children[0].click();check($('assembly').children.length===initial+1,'Add part');$('duplicate').click();check($('assembly').children.length===initial+2,'Duplicate');$('delete').click();check($('assembly').children.length===initial+1,'Delete');$('undo').click();check($('assembly').children.length===initial+2,'Undo');$('redo').click();check($('assembly').children.length===initial+1,'Redo');
const x=d.querySelector('[data-field="position"][data-axis="0"]');x.value='2';x.dispatchEvent(new Event('change'));check(x.value==='2','Transform');$('mirror').checked=true;$('mirror').dispatchEvent(new Event('change'));check($('assembly').querySelector('[aria-pressed=true]').textContent.includes('×2'),'Mirror');
$('preset').value='empty';$('build').click();check(!$('empty').hidden&&$('export').disabled,'Empty state');$('undo').click();check($('empty').hidden&&!$('export').disabled,'Restore');
const {WebGLRenderer}=await import('./webgl-renderer.js'),{combined,preset}=await import('./model.js');const canvas=document.createElement('canvas');canvas.width=400;canvas.height=400;const renderer=new WebGLRenderer(canvas);renderer.setModel(combined(preset('fighter')));renderer.render({yaw:-.65,pitch:.55,distance:3.5,width:400,height:400,grid:true,wireframe:false});const pixels=new Uint8Array(400*400*4);renderer.gl.readPixels(0,0,400,400,renderer.gl.RGBA,renderer.gl.UNSIGNED_BYTE,pixels);check(pixels.some((v,i)=>i%4===3&&v>0),'Rendered pixels');check(renderer.gl.getError()===0,'GL error');
const {library,part}=await import('./model.js');
check($('recommendedStats').tagName==='DETAILS','Stats are collapsible');$('recommendedStats').querySelector(':scope > summary').click();check(!$('recommendedStats').open,'Stats collapse');$('recommendedStats').querySelector(':scope > summary').click();check($('recommendedStats').open,'Stats expand');
check(!d.body.textContent.includes('Every part has a purpose.'),'Assembly tagline removed');
check(![...$('parts').children].some(b=>b.textContent.includes('Thruster core')),'No standalone core in parts library');
const wingButton=[...$('parts').children].find(b=>b.querySelector('small').textContent==='Swept wing');wingButton.click();check(!$('wingOptions').hidden&&$('hullOptions').hidden,'Wing inspector visible');
$('wingProfile').value='delta';$('wingProfile').dispatchEvent(new Event('change'));check($('wingProfile').value==='delta','Wing profile');
for(const [id,value] of [['wingSweep','20'],['wingDihedral','-30'],['wingThickness','0.4']]){$(id).value=value;$(id).dispatchEvent(new Event('change'));check($(id).value===value,'Wing control '+id);}
$('undo').click();check($('wingThickness').value==='0.16','Undo wing thickness');$('redo').click();check($('wingThickness').value==='0.4','Redo wing thickness');$('duplicate').click();check($('wingProfile').value==='delta'&&$('wingDihedral').value==='-30','Duplicate wing options');
const hullButton=[...$('parts').children].find(b=>b.querySelector('small').textContent==='Hull');hullButton.click();check(!$('hullOptions').hidden,'Hull inspector visible');
$('hullProfile').value='diamond';$('hullProfile').dispatchEvent(new Event('change'));check($('hullProfile').value==='diamond','Change hull profile');
$('deckTaper').value='.5';$('deckTaper').dispatchEvent(new Event('change'));check($('deckTaper').value==='0.5','Hull taper');$('undo').click();check($('deckTaper').value==='1','Undo hull taper');$('redo').click();check($('deckTaper').value==='0.5','Redo hull taper');
$('duplicate').click();check($('hullProfile').value==='diamond'&&$('deckTaper').value==='0.5','Duplicate hull options');
for(const [type,spec] of Object.entries(library).filter(([,s])=>s.composite)){
  const button=[...$('parts').children].find(b=>b.textContent.includes(spec.name));check(button,'Library button '+type);button.click();check($('selectedName').textContent===spec.name,'Select '+type);check($('hullOptions').hidden,'Hide hull options for other parts');
  renderer.setModel(combined([part(type)]));renderer.render({yaw:-.65,pitch:.55,distance:3.5,width:400,height:400,grid:false,wireframe:false});renderer.gl.readPixels(0,0,400,400,renderer.gl.RGBA,renderer.gl.UNSIGNED_BYTE,pixels);check(pixels.some((v,i)=>i%4===3&&v>0),'Block pixels '+type);check(renderer.gl.getError()===0,'Block GL error '+type);
}
check($('wingOptions').hidden,'Wing options hidden for other parts');
check($('recommendedStats').nextElementSibling.contains($('shipName')),'Stats above ship name');check($('recommendedStatsValues').children.length===17,'All requested stats');
$('preset').value='empty';$('build').click();check(Number($('stat-massEmpty').dataset.value)===0,'Empty stats');
[...$('parts').children].find(b=>b.querySelector('small').textContent==='Engine').click();
const mass=Number($('stat-massEmpty').dataset.value),cost=Number($('stat-expectedCost').dataset.value);
for(const input of d.querySelectorAll('[data-field="scale"]')){input.value='.5';input.dispatchEvent(new Event('change'));}
check(Math.abs(Number($('stat-massEmpty').dataset.value)-mass/8)<1e-8,'Scaled stats');check(Math.abs(Number($('stat-expectedCost').dataset.value)-cost/8)<1e-8,'Scaled cost');
$('undo').click();check(Math.abs(Number($('stat-massEmpty').dataset.value)-mass/4)<1e-8,'Undo stats');$('redo').click();check(Math.abs(Number($('stat-massEmpty').dataset.value)-mass/8)<1e-8,'Redo stats');
$('mirror').checked=true;$('mirror').dispatchEvent(new Event('change'));check(Math.abs(Number($('stat-massEmpty').dataset.value)-mass/4)<1e-8,'Mirrored stats');
const {presetCatalog}=await import('./model.js');
const cannonButton=[...$('parts').children].find(b=>b.querySelector('small').textContent==='Cannon');cannonButton.click();check(!$('cannonOptions').hidden,'Cannon inspector');
for(const [id,values] of [['cannonBarrel',['hexagonal','square','octagonal']],['cannonMuzzle',['hexagonal','octagonal','square','none']],['cannonReceiver',['beveledSquare','beveledParallelepiped','cylinder','square']]])for(const value of values){$(id).value=value;$(id).dispatchEvent(new Event('change'));check($(id).value===value,'Cannon option '+id);}
$('cannonReceiver').value='beveledParallelepiped';$('cannonReceiver').dispatchEvent(new Event('change'));$('undo').click();check($('cannonReceiver').value==='square','Undo cannon');$('redo').click();check($('cannonReceiver').value==='beveledParallelepiped','Redo cannon');$('duplicate').click();check($('cannonBarrel').value==='octagonal'&&$('cannonReceiver').value==='beveledParallelepiped','Duplicate cannon');
renderer.setModel(combined([{...part('cannon'),cannonBarrel:'hexagonal',cannonMuzzle:'octagonal',cannonReceiver:'beveledSquare'}]));renderer.render({yaw:-.65,pitch:.55,distance:3.5,width:400,height:400,grid:false,wireframe:false});renderer.gl.readPixels(0,0,400,400,renderer.gl.RGBA,renderer.gl.UNSIGNED_BYTE,pixels);check(pixels.some((v,i)=>i%4===3&&v>0)&&renderer.gl.getError()===0,'Cannon WebGL');hullButton.click();check($('cannonOptions').hidden,'Hide cannon inspector');
hullButton.click();$('upperChamfer').value='.2';$('upperChamfer').dispatchEvent(new Event('change'));$('lowerChamfer').value='.4';$('lowerChamfer').dispatchEvent(new Event('change'));check($('upperChamfer').value==='0.2'&&$('lowerChamfer').value==='0.4','Independent chamfers');$('undo').click();check($('lowerChamfer').value==='0'&&$('upperChamfer').value==='0.2','Undo chamfer');$('redo').click();check($('lowerChamfer').value==='0.4','Redo chamfer');$('duplicate').click();check($('upperChamfer').value==='0.2'&&$('lowerChamfer').value==='0.4','Duplicate chamfers');
const finButton=[...$('parts').children].find(b=>b.querySelector('small').textContent==='Dorsal fin');finButton.click();check(!$('finOptions').hidden,'Fin inspector');
for(const profile of ['swept','shark','delta','clipped','sail']){$('finProfile').value=profile;$('finProfile').dispatchEvent(new Event('change'));check($('finProfile').value===profile,'Fin shape');renderer.setModel(combined([{...part('fin'),finProfile:profile}]));renderer.render({yaw:-.65,pitch:.55,distance:3.5,width:400,height:400,grid:false,wireframe:false});check(renderer.gl.getError()===0,'Fin rendering');}
for(const [id,value] of [['finSweep','20'],['finCant','-30'],['finThickness','0.3']]){$(id).value=value;$(id).dispatchEvent(new Event('change'));check($(id).value===value,'Fin adjustment');}
$('undo').click();check($('finThickness').value==='0.16','Undo fin');$('redo').click();check($('finThickness').value==='0.3','Redo fin');$('duplicate').click();check($('finProfile').value==='sail'&&$('finCant').value==='-30','Duplicate fin');hullButton.click();check($('finOptions').hidden,'Hide fin inspector');
const cockpitButton=[...$('parts').children].find(b=>b.querySelector('small').textContent==='Cockpit');cockpitButton.click();check(!$('cockpitOptions').hidden,'Cockpit inspector');
$('cockpitBevel').value='.2';$('cockpitBevel').dispatchEvent(new Event('change'));check($('cockpitBevel').value==='0.2','Cockpit bevel');$('undo').click();check($('cockpitBevel').value==='0','Undo bevel');$('redo').click();check($('cockpitBevel').value==='0.2','Redo bevel');
for(const profile of ['capsule','fighterCanopy','almond','industrialDiamond','luxuryDiamond']){$('cockpitProfile').value=profile;$('cockpitProfile').dispatchEvent(new Event('change'));check($('cockpitProfile').value===profile,'Cockpit selection');renderer.setModel(combined([{...part('cockpit'),cockpitProfile:profile}]));renderer.render({yaw:-.65,pitch:.55,distance:3.5,width:400,height:400,grid:false,wireframe:false});renderer.gl.readPixels(0,0,400,400,renderer.gl.RGBA,renderer.gl.UNSIGNED_BYTE,pixels);check(pixels.some((v,i)=>i%4===3&&v>0),'Cockpit pixels '+profile);check(renderer.gl.getError()===0,'Cockpit GL '+profile);}
$('undo').click();check($('cockpitProfile').value==='industrialDiamond','Undo cockpit');$('redo').click();check($('cockpitProfile').value==='luxuryDiamond','Redo cockpit');$('duplicate').click();check($('cockpitProfile').value==='luxuryDiamond','Duplicate cockpit');hullButton.click();check($('cockpitOptions').hidden,'Hide cockpit inspector');
check(![...$('hullProfile').options].some(option=>['swan','axe'].includes(option.value)&&!option.disabled),'Retired hull options hidden');
for(const profile of ['research']){hullButton.click();$('hullProfile').value=profile;$('hullProfile').dispatchEvent(new Event('change'));check($('deckTaper').closest('label').hidden,'Composite hull has no deck taper');renderer.setModel(combined([{...part('hull'),hullProfile:profile}]));renderer.render({yaw:-.65,pitch:.55,distance:3.5,width:400,height:400,grid:false,wireframe:false});check(renderer.gl.getError()===0,'Hull variant GL '+profile);}
const engineButton=[...$('parts').children].find(b=>b.querySelector('small').textContent==='Engine');engineButton.click();check(!$('thrusterOptions').hidden,'Full thruster inspector');
for(const profile of ['drone','reverseDrone','speeder','hauler','carrier']){$('thrusterProfile').value=profile;$('thrusterProfile').dispatchEvent(new Event('change'));check($('thrusterProfile').value===profile,'Thruster selection');renderer.setModel(combined([{...part('engine'),thrusterProfile:profile}]));renderer.render({yaw:-.65,pitch:.55,distance:3.5,width:400,height:400,grid:false,wireframe:false});renderer.gl.readPixels(0,0,400,400,renderer.gl.RGBA,renderer.gl.UNSIGNED_BYTE,pixels);check(pixels.some((v,i)=>i%4===3&&v>0),'Thruster pixels '+profile);}
$('undo').click();check($('thrusterProfile').value==='hauler','Undo complete thruster');$('redo').click();check($('thrusterProfile').value==='carrier','Redo complete thruster');$('duplicate').click();check($('thrusterProfile').value==='carrier','Duplicate complete thruster');
for(const id of ['interceptor','carrier','megaCargo','explorer','cruise']){
  const before=$('shipName').value;$('preset').value=id;$('preset').dispatchEvent(new Event('change'));check($('presetDescription').textContent===presetCatalog[id].description,'Preset description');$('build').click();check($('shipName').value===presetCatalog[id].name,'Preset name '+id);check($('assembly').children.length===preset(id).length,'Preset assembly '+id);check(Number($('stat-acceleration').dataset.value)>0,'Preset stats '+id);
  renderer.setModel(combined(preset(id)));renderer.render({yaw:-.65,pitch:.55,distance:3.5,width:400,height:400,grid:false,wireframe:false});renderer.gl.readPixels(0,0,400,400,renderer.gl.RGBA,renderer.gl.UNSIGNED_BYTE,pixels);check(pixels.some((v,i)=>i%4===3&&v>0),'Preset pixels '+id);check(renderer.gl.getError()===0,'Preset GL '+id);
  $('undo').click();check($('shipName').value===before,'Undo preset '+id);$('redo').click();check($('shipName').value===presetCatalog[id].name,'Redo preset '+id);
}
check($('save').nextElementSibling===$('testFlight')&&$('testFlight').nextElementSibling===$('export'),'Test Flight toolbar placement');
const designName=$('shipName').value,designParts=$('assembly').children.length;
$('testFlight').click();await new Promise(resolve=>{const button=$('chooseFlight3D');button.closest('dialog').addEventListener('close',resolve,{once:true});button.click();});await new Promise(r=>setTimeout(r,400));check($('testFlightDialog').open,'Flight opens');check($('flightTitle').textContent===designName,'Flight current ship');check(!$('flightError').textContent,'Flight WebGL initialization');check($('flightShip').getContext('webgl').getError()===0,'Flight GL');
$('flightPause').click();check($('flightPause').textContent==='Resume','Flight pause');$('flightReset').click();check($('flightPause').textContent==='Pause','Flight restart');
await new Promise(resolve=>{$('testFlightDialog').addEventListener('close',resolve,{once:true});$('flightClose').click();});check(!$('testFlightDialog'),'Flight closes');check($('shipName').value===designName&&$('assembly').children.length===designParts,'Flight preserves design');
$('testFlight').click();await new Promise(resolve=>{const button=$('chooseFlight3D');button.closest('dialog').addEventListener('close',resolve,{once:true});button.click();});check($('testFlightDialog').open,'Flight reopens');await new Promise(resolve=>{$('testFlightDialog').addEventListener('close',resolve,{once:true});$('testFlightDialog').close();});check(!$('testFlightDialog'),'Flight cleanup');
$('preset').value='empty';$('build').click();check($('testFlight').disabled,'Empty ship cannot launch');$('undo').click();check(!$('testFlight').disabled,'Restored ship can launch');
$('preset').value='empty';$('build').click();check($('flightReady').dataset.ready==='false'&&$('flightReady').textContent.includes('hull and engine'),'Empty readiness');
hullButton.click();check($('flightReady').dataset.ready==='false'&&$('flightReady').textContent.includes('needs engine'),'Hull only readiness');engineButton.click();check($('flightReady').dataset.ready==='true','Hull and engine ready');$('delete').click();check($('flightReady').dataset.ready==='false','Deletion updates readiness');$('undo').click();check($('flightReady').dataset.ready==='true','Undo restores readiness');
const win=frame.contentWindow,originalURL=win.URL.createObjectURL,originalClick=win.HTMLAnchorElement.prototype.click;let exportedBlob,exportedName;
win.URL.createObjectURL=blob=>{exportedBlob=blob;return originalURL.call(win.URL,blob);};win.HTMLAnchorElement.prototype.click=function(){exportedName=this.download;};
try{$('exportConfig').click();}finally{win.URL.createObjectURL=originalURL;win.HTMLAnchorElement.prototype.click=originalClick;}
check(exportedName.endsWith('.starship.json'),'Configuration filename');check(exportedBlob.type==='application/json','Configuration MIME');const exportedText=await exportedBlob.text(),configuration=JSON.parse(exportedText);check(configuration.version===1&&configuration.parts.length===$('assembly').children.length,'Editable configuration content');
$('preset').value='empty';$('build').click();const transfer=new win.DataTransfer();transfer.items.add(new win.File([exportedText],exportedName,{type:'application/json'}));$('file').files=transfer.files;await $('file').onchange();check($('shipName').value===configuration.name&&$('assembly').children.length===configuration.parts.length,'Configuration reimport');check($('flightReady').dataset.ready==='true','Imported configuration usable');
const clipboardDescriptor=Object.getOwnPropertyDescriptor(win.navigator,'clipboard');let copied;
try{
  Object.defineProperty(win.navigator,'clipboard',{configurable:true,value:{writeText:async text=>{copied=text;}}});await $('copyConfig').onclick();const parsed=JSON.parse(copied);check(parsed.name===configuration.name&&parsed.parts.length===configuration.parts.length,'Copy editable JSON');check($('status').textContent.includes('copied'),'Copy feedback');
  Object.defineProperty(win.navigator,'clipboard',{configurable:true,value:{writeText:async()=>{throw Error('Denied');}}});await $('copyConfig').onclick();check($('copyConfigDialog').open,'Clipboard fallback');check($('copyConfigDialog').querySelector('textarea').value===copied,'Fallback JSON');await new Promise(resolve=>{$('copyConfigDialog').addEventListener('close',resolve,{once:true});$('copyConfigDialog').close();});
}finally{if(clipboardDescriptor)Object.defineProperty(win.navigator,'clipboard',clipboardDescriptor);else delete win.navigator.clipboard;}
document.getElementById('result').textContent='PASS: JSON presets, copy configuration and fallback, export/reimport, readiness, Test Flight and editor controls';}catch(e){document.getElementById('result').textContent='FAIL: '+e.stack;}};
</script></body></html>
