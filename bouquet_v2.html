<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lancio del Bouquet</title>

<style>
html,body{
    margin:0;
    overflow:hidden;
    background:#ead8c5;
    font-family:Arial,sans-serif;
    touch-action:none;
}

canvas{
    display:block;
}

#ui{
    position:fixed;
    top:10px;
    left:10px;
    right:10px;
    display:flex;
    justify-content:space-between;
    z-index:10;
    font-weight:bold;
    color:white;
    text-shadow:0 2px 4px black;
}

.panel{
    background:rgba(0,0,0,.4);
    padding:10px;
    border-radius:12px;
}
</style>
</head>
<body>

<div id="ui">
    <div class="panel">Score: <span id="score">0</span></div>
    <div class="panel">Best: <span id="best">0</span></div>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");

let W,H;

let score = 0;
let best = Number(localStorage.getItem("bouquetBest") || 0);

let bride;
let bouquet;
let bridesmaids=[];

let dragStart=null;
let dragCurrent=null;

function resize(){
    W=canvas.width=window.innerWidth;
    H=canvas.height=window.innerHeight;

    bride={
        x:W/2,
        y:H-90
    };

    resetBouquet();
}

window.addEventListener("resize",resize);

function resetBouquet(){
    bouquet={
        x:bride.x,
        y:bride.y-50,
        vx:0,
        vy:0,
        flying:false,
        r:14
    };
}

function createBridesmaids(){

    const colors=[
        "#e91e63",
        "#2196f3",
        "#4caf50",
        "#ff9800",
        "#9c27b0"
    ];

    const values=[10,20,30,40,50];

    bridesmaids=[];

    for(let i=0;i<10;i++){

        const idx=Math.floor(Math.random()*5);

        bridesmaids.push({
            x:Math.random()*W,
            y:50+Math.random()*(H*0.45),
            r:25,
            color:colors[idx],
            points:values[idx],
            speed:1+idx*0.6,
            bounce:Math.random()*Math.PI*2
        });
    }
}

function addScore(points){
    score+=points;

    if(score>best){
        best=score;
        localStorage.setItem("bouquetBest",best);
    }
}

function drawBackground(){

    ctx.fillStyle="#ead8c5";
    ctx.fillRect(0,0,W,H);

    ctx.strokeStyle="#d7c3ad";

    for(let x=0;x<W;x+=40){
        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,H);
        ctx.stroke();
    }

    for(let y=0;y<H;y+=40){
        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(W,y);
        ctx.stroke();
    }
}

function drawBride(){

    ctx.fillStyle="white";

    ctx.beginPath();
    ctx.arc(bride.x,bride.y+20,50,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#ffdbac";
    ctx.beginPath();
    ctx.arc(bride.x,bride.y-20,20,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#5d4037";
    ctx.beginPath();
    ctx.arc(bride.x,bride.y-30,18,0,Math.PI);
    ctx.fill();

    ctx.fillStyle="black";
    ctx.font="bold 18px Arial";
    ctx.textAlign="center";
    ctx.fillText("SPOSA",bride.x,bride.y+80);
}

function drawBridesmaid(m){

    ctx.fillStyle="gold";
    ctx.font="bold 20px Arial";
    ctx.textAlign="center";
    ctx.fillText(m.points,m.x,m.y-45);

    ctx.fillStyle=m.color;
    ctx.beginPath();
    ctx.arc(m.x,m.y+10,m.r+8,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#ffdbac";
    ctx.beginPath();
    ctx.arc(m.x,m.y-10,m.r,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#3e2723";
    ctx.beginPath();
    ctx.arc(m.x,m.y-20,m.r*0.9,Math.PI,0);
    ctx.fill();
}

function drawBouquet(){

    ctx.fillStyle="green";
    ctx.beginPath();
    ctx.arc(bouquet.x,bouquet.y,bouquet.r,0,Math.PI*2);
    ctx.fill();

    const flowers=[
        [-8,-4],
        [8,-4],
        [0,8]
    ];

    flowers.forEach(f=>{
        ctx.fillStyle="#ff69b4";
        ctx.beginPath();
        ctx.arc(
            bouquet.x+f[0],
            bouquet.y+f[1],
            6,
            0,
            Math.PI*2
        );
        ctx.fill();
    });
}

function drawAim(){

    if(!dragStart || !dragCurrent || bouquet.flying)
        return;

    ctx.strokeStyle="white";
    ctx.lineWidth=4;
    ctx.setLineDash([10,10]);

    ctx.beginPath();
    ctx.moveTo(bouquet.x,bouquet.y);

    ctx.lineTo(
        bouquet.x+(dragStart.x-dragCurrent.x),
        bouquet.y+(dragStart.y-dragCurrent.y)
    );

    ctx.stroke();
    ctx.setLineDash([]);
}

function updateBridesmaids(){

    bridesmaids.forEach(m=>{

        m.x+=m.speed;

        if(m.x>W+50){
            m.x=-50;
        }

        m.y+=Math.sin(Date.now()*0.002+m.bounce)*0.2;
    });
}

function updateBouquet(){

    if(!bouquet.flying) return;

    bouquet.x+=bouquet.vx;
    bouquet.y+=bouquet.vy;

    bouquet.vx*=0.99;
    bouquet.vy*=0.99;

    bridesmaids.forEach(m=>{

        const dx=bouquet.x-m.x;
        const dy=bouquet.y-m.y;

        if(Math.hypot(dx,dy)<m.r+bouquet.r){

            addScore(m.points);

            createBridesmaids();
            resetBouquet();
        }
    });

    if(
        bouquet.x<0 ||
        bouquet.x>W ||
        bouquet.y<0 ||
        bouquet.y>H ||
        Math.abs(bouquet.vx)+Math.abs(bouquet.vy)<0.3
    ){
        resetBouquet();
    }
}

function draw(){

    drawBackground();

    bridesmaids.forEach(drawBridesmaid);

    drawBride();

    drawAim();

    drawBouquet();

    scoreEl.textContent=score;
    bestEl.textContent=best;
}

function loop(){

    updateBridesmaids();
    updateBouquet();

    draw();

    requestAnimationFrame(loop);
}

canvas.addEventListener("pointerdown",e=>{

    if(bouquet.flying) return;

    const dx=e.clientX-bouquet.x;
    const dy=e.clientY-bouquet.y;

    if(Math.hypot(dx,dy)<40){
        dragStart={
            x:e.clientX,
            y:e.clientY
        };

        dragCurrent=dragStart;
    }
});

canvas.addEventListener("pointermove",e=>{

    if(!dragStart) return;

    dragCurrent={
        x:e.clientX,
        y:e.clientY
    };
});

canvas.addEventListener("pointerup",e=>{

    if(!dragStart) return;

    bouquet.vx=(dragStart.x-dragCurrent.x)*0.12;
    bouquet.vy=(dragStart.y-dragCurrent.y)*0.12;

    bouquet.flying=true;

    dragStart=null;
    dragCurrent=null;
});

resize();
createBridesmaids();
loop();
</script>

</body>
</html>
